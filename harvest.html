<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Προγραμματισμός Τρύγου</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2620">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --ink:#1a1a1a; --ink-dim:#666; --ink-faint:#999;
    --bg:#faf9f6; --card:#fff; --line:#e8e6e0; --gold:#c99a3e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5;}
  .topbar{background:#1a1a1a;color:#fff;padding:14px 20px;position:sticky;top:0;z-index:50;font-family:-apple-system,sans-serif;}
  .topbar-title{font-size:15px;font-weight:600;}
  .topbar-sub{font-size:12px;color:#bbb;margin-top:2px;}
  .wrap{max-width:960px;margin:0 auto;padding:1rem 1.25rem 4rem;}
  .back-link{display:inline-block;margin:1rem 0;font-size:13px;color:var(--ink-dim);text-decoration:none;font-family:-apple-system,sans-serif;}
  .variety-block{margin-bottom:2.5rem;}
  .variety-title{font-size:22px;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
  .section-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:1.25rem 0 8px;font-family:-apple-system,sans-serif;}
  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);}
  .toggle-row{display:flex;gap:6px;}
  .toggle-btn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px 13px;font-size:12px;cursor:pointer;color:var(--ink-dim);font-family:-apple-system,sans-serif;}
  .toggle-btn.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .matrix-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
  table.matrix{border-collapse:collapse;width:100%;font-family:-apple-system,sans-serif;font-size:13px;}
  table.matrix th,table.matrix td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap;}
  table.matrix th{background:#f5f4f0;font-size:11px;color:var(--ink-dim);font-weight:600;}
  table.matrix td:first-child,table.matrix th:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:600;z-index:1;max-width:120px;overflow:hidden;text-overflow:ellipsis;}
  table.matrix th:first-child{background:#f5f4f0;z-index:2;}
  table.matrix td.forecast-col,table.matrix th.forecast-col{background:#fbf3e6;font-weight:600;}
  table.matrix td.actual-col,table.matrix th.actual-col{background:#eaf5ee;}
  table.matrix tr:last-child td{border-bottom:none;}
  table.matrix td:last-child,table.matrix th:last-child{border-right:none;}
  .cell-val{cursor:pointer;display:inline-block;min-width:34px;}
  .cell-empty{color:#ddd;}
  .cell-detail{font-size:10px;color:var(--ink-faint);margin-top:2px;line-height:1.3;}
  .no-data{text-align:center;color:var(--ink-faint);padding:3rem 1rem;font-size:14px;font-family:-apple-system,sans-serif;}
  .btn-chart{background:var(--gold);border:1px solid var(--gold);border-radius:16px;padding:5px 13px;font-size:12px;cursor:pointer;color:#fff;font-family:-apple-system,sans-serif;display:inline-flex;align-items:center;gap:5px;}
  .btn-chart:hover{background:#b3872f;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;}
  .chart-modal{background:#fff;border-radius:12px;padding:1.25rem;max-width:960px;width:100%;max-height:90vh;overflow:auto;font-family:-apple-system,sans-serif;}
  .chart-modal-title{font-size:15px;font-weight:700;margin-bottom:2px;font-family:-apple-system,sans-serif;}
  .chart-modal-sub{font-size:12px;color:var(--ink-dim);margin-bottom:14px;}
  .chart-close{float:right;background:none;border:none;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-dim);}
  .chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:10px;}
  .chart-card{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fdfdfc;}
  .chart-card-title{font-size:12px;font-weight:700;margin-bottom:4px;font-family:-apple-system,sans-serif;}
  .year-row{display:inline-flex;gap:6px;align-items:center;margin:.75rem 0 1.25rem;font-family:-apple-system,sans-serif;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--card);}
  .year-lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);margin-right:4px;}
  .year-btn{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--ink-dim);font-family:-apple-system,sans-serif;}
  .year-btn.on{background:var(--gold);color:#fff;border-color:var(--gold);}
  .section-toggle{display:flex;gap:6px;margin-bottom:10px;font-family:-apple-system,sans-serif;}
  .section-toggle-btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-dim);}
  .section-toggle-btn.on{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* ─── Σύνοψη τρύγου: συνολικά κιλά + γράφημα πίτας ανά ποικιλία ─── */
  .summary-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 1.75rem;font-family:-apple-system,sans-serif;}
  .summary-hdr{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;}
  .summary-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);margin-bottom:6px;}
  .summary-total{font-family:Georgia,serif;font-size:34px;font-weight:700;color:var(--ink);}
  .summary-unit{font-size:16px;font-weight:400;color:var(--ink-dim);}
  .pie-legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .pie-legend-row{display:flex;align-items:center;gap:6px;font-size:12.5px;}
  .pie-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .pie-legend-name{font-weight:600;color:var(--ink);}
  .pie-legend-val{color:var(--ink-dim);}
  .pie-legend-pct{color:var(--gold);font-weight:700;}

  /* ─── Προγραμματισμός τρύγου μέσα στον πίνακα: κλικ στον παραγωγό/block ─── */
  .block-cell{cursor:pointer;}
  .block-cell:hover{text-decoration:underline;}
  tr.row-scheduled td,tr.row-scheduled td.forecast-col,tr.row-scheduled td.actual-col,tr.row-scheduled td:first-child{background:#fbeed9;}
  tr.row-harvested td,tr.row-harvested td.forecast-col,tr.row-harvested td.actual-col,tr.row-harvested td:first-child{background:#e3f2e6;}
  .sched-modal{max-width:380px;}
  .sched-meta{font-size:12px;color:var(--ink-dim);margin-bottom:14px;font-family:-apple-system,sans-serif;}
  .sched-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-family:-apple-system,sans-serif;}
  .sched-row label{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;}
  .sched-row input{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;font-family:-apple-system,sans-serif;}
  .sched-hint{font-size:12px;color:var(--ink-faint);margin-bottom:12px;font-family:-apple-system,sans-serif;}
  .sched-actions{display:flex;gap:8px;margin-top:6px;}
  .sched-actions button{background:var(--gold);border:1px solid var(--gold);border-radius:16px;padding:7px 16px;font-size:13px;cursor:pointer;color:#fff;font-family:-apple-system,sans-serif;}
  .sched-actions button.ghost{background:transparent;color:var(--ink-dim);border-color:var(--line);}
  .badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;font-family:-apple-system,sans-serif;display:inline-block;}
  .badge.scheduled{background:#fbeed9;color:#8a6416;}
  .badge.done{background:#e3f2e6;color:#2f6a3a;}

  /* ─── Μικρό γράφημα προόδου τρύγου (blocks: τρυγήθηκαν / προγραμματισμένα / απομένουν) ─── */
  .progress-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:0 0 1rem;font-family:-apple-system,sans-serif;}
  .progress-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);margin-bottom:10px;}
  .progress-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#eeece6;margin-bottom:12px;}
  .progress-seg{height:100%;}
  .progress-seg.done{background:#4f9e5c;}
  .progress-seg.sched{background:#d9a057;}
  .progress-seg.remain{background:#ddd9cd;}
  .progress-stats{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim);}
  .progress-stat b{font-size:17px;display:block;font-family:Georgia,serif;color:var(--ink);}
  .progress-stat.done b{color:#2f6a3a;}
  .progress-stat.sched b{color:#8a6416;}

  /* ─── Σειρά με τα κουτάκια: Ημερολόγιο (ψηλό, αριστερά) · Σύνολο (πάνω δεξιά) · Πρόοδος (κάτω δεξιά, πιο μικρό) ─── */
  .stats-row{display:grid;grid-template-columns:1fr;gap:14px;margin:0 0 1.75rem;align-items:stretch;}
  @media(min-width:760px){
    .stats-row{
      grid-template-columns:1fr 1.3fr;
      grid-template-areas:"cal total" "cal progress";
    }
    .gc-schedule{grid-area:cal;}
    .gc-summary{grid-area:total;}
    .gc-progress{grid-area:progress;}
  }
  .stats-row .progress-card,.stats-row .summary-card,.stats-row .link-card{margin:0;height:100%;}
  .link-card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;text-decoration:none;color:var(--ink);font-family:-apple-system,sans-serif;transition:border-color .15s;}
  .link-card:hover{border-color:var(--gold);}
  .link-card-title{font-size:14px;font-weight:700;margin-bottom:8px;}
  .link-card-desc{font-size:12px;color:var(--ink-dim);line-height:1.4;margin-bottom:12px;flex:1;}
  .link-card-cta{font-size:12px;color:var(--gold);font-weight:600;}
</style>
</head>
<body>

<div id="chartModalContainer"></div>
<div id="scheduleModalContainer"></div>

<div class="topbar">
  <div class="topbar-title" id="topbarTitle">Προγραμματισμός Τρύγου</div>
  <div class="topbar-sub" id="topbarSub">Φόρτωση...</div>
</div>

<div class="wrap">
  <a class="back-link" href="#" id="backLink">← Πίσω στα reports</a>
  <div id="content"><div class="no-data">Φόρτωση δεδομένων...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const urlParams=new URLSearchParams(window.location.search);
const WINERY_ID=urlParams.get('winery_id');
document.getElementById('backLink').href='reports.html?winery_id='+WINERY_ID;

// Οι VARIETY_NAME_FIX / parseVarietyNames ζουν πλέον στο shared.js (κοινές για όλες τις σελίδες).

function fmtShortDate(d){
  if(!d)return'—';
  const dt=new Date(d+'T00:00:00');
  return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0');
}
function fmtFullDate(d){
  if(!d)return'—';
  const dt=new Date(d+'T00:00:00');
  return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear();
}

// ─── Προγραμματισμός τρύγου (κλικ σε γραμμή) — γράφει στον ίδιο πίνακα harvest_schedule
// που χρησιμοποιεί το harvest-schedule.html, ώστε οι δύο σελίδες να δείχνουν πάντα την ίδια κατάσταση.
let scheduleByBlock={};        // block_id -> «τρέχον» harvest_schedule row (ίδια λογική με harvest-schedule.html)
let rowBlockIndex={};          // { variety: { rowLabel: block_id } } — για να ξέρουμε ΠΟΙΟ block αντιστοιχεί σε κάθε γραμμή του πίνακα
let currentPersonName='';
let isAdmin=false;             // true μόνο για πραγματικό Supabase login (σύμβουλος) — όχι για access code
let allBlocksCount=0;          // σύνολο blocks του οινοποιείου — για το μικρό γράφημα προόδου τρύγου

let allVarietyData={}; // unfiltered, all years — { varietyName: { blockName: { date: {...} } } }
let varietyData={};    // filtered to selectedYear — same shape, used by render/chart
let allActualData={};  // unfiltered — { varietyName: { blockName: { harvestDate: kg } } }
let actualData={};     // filtered to selectedYear
let allActualBaumeData={}; // unfiltered — { varietyName: { blockName: { harvestDate: baume } } } — Baumé καταχωρημένο ΣΤΟ ίδιο το ημερολόγιο τρύγου (harvest_schedule.actual_baume), όχι από τη δειγματοληψία
let actualBaumeData={};    // filtered to selectedYear
let chemMetric='baume';
let agroMetric='berryWeight';
let availableYears=[];
let selectedYear=null;
let sectionMode={}; // { varietyName: 'chem'|'agro' }, defaults to 'chem'

function applyYearFilter(){
  varietyData={};
  Object.keys(allVarietyData).forEach(variety=>{
    Object.keys(allVarietyData[variety]).forEach(block=>{
      Object.keys(allVarietyData[variety][block]).forEach(date=>{
        if(!selectedYear || date.slice(0,4)===String(selectedYear)){
          if(!varietyData[variety])varietyData[variety]={};
          if(!varietyData[variety][block])varietyData[variety][block]={};
          varietyData[variety][block][date]=allVarietyData[variety][block][date];
        }
      });
    });
  });
  actualData={};
  Object.keys(allActualData).forEach(variety=>{
    Object.keys(allActualData[variety]).forEach(block=>{
      Object.keys(allActualData[variety][block]).forEach(date=>{
        if(!selectedYear || date.slice(0,4)===String(selectedYear)){
          if(!actualData[variety])actualData[variety]={};
          if(!actualData[variety][block])actualData[variety][block]={};
          actualData[variety][block][date]=allActualData[variety][block][date];
        }
      });
    });
  });
  actualBaumeData={};
  Object.keys(allActualBaumeData).forEach(variety=>{
    Object.keys(allActualBaumeData[variety]).forEach(block=>{
      Object.keys(allActualBaumeData[variety][block]).forEach(date=>{
        if(!selectedYear || date.slice(0,4)===String(selectedYear)){
          if(!actualBaumeData[variety])actualBaumeData[variety]={};
          if(!actualBaumeData[variety][block])actualBaumeData[variety][block]={};
          actualBaumeData[variety][block][date]=allActualBaumeData[variety][block][date];
        }
      });
    });
  });
}
function setYear(y){selectedYear=y;applyYearFilter();render();}


async function loadData(){
  if(!WINERY_ID){document.getElementById('content').innerHTML='<div class="no-data">Λείπει winery_id.</div>';return;}
  const access=await requireAccess(supa,WINERY_ID);
  if(!access)return;
  currentPersonName=access.personName;
  isAdmin=access.method==='auth';

  const{data:winery}=await supa.from('wineries').select('name').eq('id',WINERY_ID).maybeSingle();
  document.getElementById('topbarTitle').textContent=(winery?winery.name:'')+' — Τρύγος';
  document.getElementById('topbarSub').textContent='Προγραμματισμός Τρύγου';

  await loadAndRender();
}

// Ξαναφορτώνει όλα τα δεδομένα (πίνακες + πρόγραμμα τρύγου) χωρίς να ξανακάνει έλεγχο πρόσβασης —
// καλείται και στην αρχική φόρτωση και μετά από κάθε ενέργεια προγραμματισμού/καταχώρησης τρύγου.
async function loadAndRender(){
  const{data:visitsRows}=await supa.from('visits').select('id,visit_date').eq('winery_id',WINERY_ID);
  const visitDateById={};
  (visitsRows||[]).forEach(v=>{visitDateById[v.id]=v.visit_date;});

  const{data:areasRows}=await supa.from('areas').select('id').eq('winery_id',WINERY_ID);
  const areaIds=(areasRows||[]).map(a=>a.id);
  let vineyardsRows=[];
  let blocksRows=[];
  if(areaIds.length){
    const{data:vd}=await supa.from('vineyards').select('id,vineyard_code').in('area_id',areaIds);
    vineyardsRows=vd||[];
    const{data}=await supa.from('blocks').select('id,block_code,variety,vineyard_id').in('area_id',areaIds);
    blocksRows=data||[];
  }
  const vineyardCodeById={};
  vineyardsRows.forEach(v=>{vineyardCodeById[v.id]=v.vineyard_code;});
  const blockById={};
  blocksRows.forEach(b=>{blockById[b.id]=b;});
  const blockIds=blocksRows.map(b=>b.id);
  allBlocksCount=blocksRows.length;

  // Ετικέτα γραμμής στον πίνακα = ο αμπελώνας-γονέας (π.χ. όνομα παραγωγού στο Βασιλικόν), ώστε
  // πολλαπλά blocks/ποικιλίες κάτω από τον ίδιο αμπελώνα να εμφανίζονται μαζί σε μία γραμμή —
  // ΕΚΤΟΣ αν δύο blocks του ΙΔΙΟΥ αμπελώνα έχουν την ΙΔΙΑ ποικιλία, οπότε η συγχώνευση θα έκρυβε
  // το ένα block πίσω από το άλλο (και θα "έσβηνε" σιωπηλά δεδομένα της ίδιας ημερομηνίας). Σε
  // αυτή την περίπτωση δείχνουμε αμπελώνα + block, ώστε να ξεχωρίζουν.
  const varietyVineyardCount={};
  blocksRows.forEach(b=>{
    const vCode=vineyardCodeById[b.vineyard_id]||b.block_code;
    parseVarietyNames(b.variety).forEach(variety=>{
      const key=variety+'|'+vCode;
      varietyVineyardCount[key]=(varietyVineyardCount[key]||0)+1;
    });
  });
  function rowLabelFor(b,variety){
    const vCode=vineyardCodeById[b.vineyard_id]||b.block_code;
    const key=variety+'|'+vCode;
    if(vCode!==b.block_code&&varietyVineyardCount[key]>1)return vCode+' · '+b.block_code;
    return vCode;
  }

  // { variety: { rowLabel: block_id } } — ώστε το κλικ πάνω σε μια γραμμή του πίνακα να ξέρει ΠΟΙΟ
  // block να προγραμματίσει (η γραμμή δείχνει τον αμπελώνα/παραγωγό, όχι το block id).
  rowBlockIndex={};
  blocksRows.forEach(b=>{
    parseVarietyNames(b.variety).forEach(variety=>{
      const label=rowLabelFor(b,variety);
      if(!rowBlockIndex[variety])rowBlockIndex[variety]={};
      rowBlockIndex[variety][label]=b.id;
    });
  });

  let estRows=[];
  if(blockIds.length){
    const{data,error}=await supa.from('estimation_observations').select('*').in('block_id',blockIds);
    if(error){console.error(error);document.getElementById('content').innerHTML='<div class="no-data">Σφάλμα φόρτωσης.</div>';return;}
    estRows=data||[];
  }

  let actualRows=[];
  if(blockIds.length){
    // Αν η στήλη actual_baume δεν έχει προστεθεί ακόμα στη βάση (ξεχάστηκε το ALTER TABLE), αυτό το
    // select αποτυγχάνει ΕΝΤΕΛΩΣ (όχι μόνο για το baume) — γι' αυτό κάνουμε fallback χωρίς αυτή τη
    // στήλη, ώστε τα κιλά να συνεχίζουν να εμφανίζονται ό,τι κι αν γίνει με το Baumé.
    let res=await supa.from('harvest_schedule').select('block_id,scheduled_date,actual_kg,actual_baume').in('block_id',blockIds).not('actual_kg','is',null);
    if(res.error){
      console.warn('Το select με actual_baume απέτυχε (μάλλον λείπει η στήλη στη βάση) — δοκιμή χωρίς αυτήν:',res.error);
      res=await supa.from('harvest_schedule').select('block_id,scheduled_date,actual_kg').in('block_id',blockIds).not('actual_kg','is',null);
    }
    if(res.error)console.error('harvest_schedule load failed:',res.error);
    else actualRows=res.data||[];
  }

  // Όλες οι γραμμές harvest_schedule (ανοιχτές + ολοκληρωμένες), για να δείχνει ο πίνακας ποιες
  // γραμμές είναι προγραμματισμένες (κίτρινο) ή τρυγημένες (πράσινο) και να μπορεί να γίνει edit.
  let allSchedRows=[];
  if(blockIds.length){
    let res2=await supa.from('harvest_schedule').select('id,block_id,scheduled_date,estimated_kg,actual_kg,actual_baume,created_by,updated_by').in('block_id',blockIds).order('scheduled_date',{ascending:true});
    if(res2.error){
      console.warn('Το select με actual_baume απέτυχε — δοκιμή χωρίς αυτήν:',res2.error);
      res2=await supa.from('harvest_schedule').select('id,block_id,scheduled_date,estimated_kg,actual_kg,created_by,updated_by').in('block_id',blockIds).order('scheduled_date',{ascending:true});
    }
    if(res2.error)console.error('harvest_schedule (όλες οι γραμμές) load failed:',res2.error);
    else allSchedRows=res2.data||[];
  }
  scheduleByBlock={};
  allSchedRows.forEach(s=>{
    const prev=scheduleByBlock[s.block_id];
    if(!prev){scheduleByBlock[s.block_id]=s;return;}
    const prevOpen=(prev.actual_kg===null||prev.actual_kg===undefined);
    const curOpen=(s.actual_kg===null||s.actual_kg===undefined);
    if(curOpen&&!prevOpen)scheduleByBlock[s.block_id]=s;
    else if(curOpen===prevOpen&&s.scheduled_date>prev.scheduled_date)scheduleByBlock[s.block_id]=s;
  });

  allVarietyData={};
  allActualData={};
  allActualBaumeData={};
  const yearSet=new Set();
  estRows.forEach(r=>{
    const block=blockById[r.block_id];
    if(!block)return;
    const date=r.observed_date||visitDateById[r.visit_id]||null;
    if(!date)return;
    yearSet.add(date.slice(0,4));
    const names=parseVarietyNames(block.variety);
    names.forEach(variety=>{
      const rowLabel=rowLabelFor(block,variety);
      if(!allVarietyData[variety])allVarietyData[variety]={};
      if(!allVarietyData[variety][rowLabel])allVarietyData[variety][rowLabel]={};
      allVarietyData[variety][rowLabel][date]={
        baume:r.baume, tartaricAcid:r.tartaric_acid, ph:r.ph,
        berryWeight:r.berry_weight_g, juiceYield:r.juice_yield, yieldEst:r.yield_est_kg_ha
      };
    });
  });
  actualRows.forEach(r=>{
    const block=blockById[r.block_id];
    if(!block||!r.scheduled_date)return;
    yearSet.add(r.scheduled_date.slice(0,4));
    const names=parseVarietyNames(block.variety);
    names.forEach(variety=>{
      const rowLabel=rowLabelFor(block,variety);
      if(!allActualData[variety])allActualData[variety]={};
      if(!allActualData[variety][rowLabel])allActualData[variety][rowLabel]={};
      allActualData[variety][rowLabel][r.scheduled_date]=(allActualData[variety][rowLabel][r.scheduled_date]||0)+(r.actual_kg||0);
      // Baumé καταχωρημένο απευθείας στο ημερολόγιο τρύγου τη στιγμή του τρύγου (όχι από δειγματοληψία)
      if(r.actual_baume!==null&&r.actual_baume!==undefined){
        if(!allActualBaumeData[variety])allActualBaumeData[variety]={};
        if(!allActualBaumeData[variety][rowLabel])allActualBaumeData[variety][rowLabel]={};
        allActualBaumeData[variety][rowLabel][r.scheduled_date]=r.actual_baume;
      }
    });
  });

  availableYears=[...yearSet].sort();
  selectedYear=availableYears.length?availableYears[availableYears.length-1]:null;
  applyYearFilter();
  render();
}

function setChemMetric(m){chemMetric=m;render();}
function setAgroMetric(m){agroMetric=m;render();}

function toggleCell(el){
  el.classList.toggle('expanded');
  const detail=el.querySelector('.cell-detail');
  if(detail)detail.style.display=el.classList.contains('expanded')?'block':'none';
}

const CHEM_LABELS={baume:'Baumé', tartaricAcid:'Τρυγικό οξύ', ph:'pH'};
const CHEM_UNITS={baume:'°', tartaricAcid:'g/L', ph:''};
const AGRO_LABELS={berryWeight:'Βάρος ράγας', juiceYield:'Απόδοση χυμού'};
const AGRO_UNITS={berryWeight:'g', juiceYield:'mg/g'};

function buildMatrixHTML(blockMap, metric, allFields, labels, units, actualMap, showHarvestCol, actualBaumeMap, variety){
  blockMap=blockMap||{};
  actualMap=actualMap||{};
  actualBaumeMap=actualBaumeMap||{};
  const rowIndex=rowBlockIndex[variety]||{};
  // Ένωση: ένα block μπορεί να υπάρχει μόνο στο actualMap (τρυγήθηκε χωρίς ποτέ να έχει δειγματοληψία)
  // ή μόνο στο blockMap (έχει δειγματοληψίες αλλά δεν τρυγήθηκε ακόμα) — πρέπει να φαίνεται σε κάθε περίπτωση.
  const blocks=[...new Set([...Object.keys(blockMap),...Object.keys(actualMap)])].sort();
  const allDates=new Set();
  blocks.forEach(b=>Object.keys(blockMap[b]||{}).forEach(d=>allDates.add(d)));
  const dates=[...allDates].sort();

  if(!blocks.length)return'<div class="no-data">Δεν υπάρχουν δεδομένα.</div>';

  // Πρόβλεψη απόδοσης: παίρνουμε την πιο πρόσφατη καταχωρημένη τιμή yieldEst ανά block
  const forecastByBlock={};
  blocks.forEach(b=>{
    const recDates=Object.keys(blockMap[b]||{}).sort();
    for(let i=recDates.length-1;i>=0;i--){
      const v=blockMap[b][recDates[i]].yieldEst;
      if(v!==null&&v!==undefined){forecastByBlock[b]=v;break;}
    }
  });

  // Πραγματική ποσότητα: άθροισμα όλων των φάσεων τρύγου (harvest_schedule) ανά block
  const actualByBlock={};
  blocks.forEach(b=>{
    const entries=actualMap[b];
    if(!entries)return;
    const total=Object.values(entries).reduce((s,v)=>s+(v||0),0);
    if(total>0)actualByBlock[b]=total;
  });

  // Στήλη "Τρύγος — ημ/νία · Baumé": ένα block μπορεί να τρυγηθεί σε παραπάνω από μία φάσεις
  // (διαφορετικές ημερομηνίες μέσα στο ίδιο actualMap), οπότε ομαδοποιούμε ανά block και δείχνουμε
  // όλες τις φάσεις μαζί στο ίδιο κελί. Προτεραιότητα έχει το Baumé που καταχωρήθηκε ΑΠΕΥΘΕΙΑΣ στο
  // ημερολόγιο τρύγου τη στιγμή της συγκομιδής (actualBaumeMap) — αυτό είναι το πραγματικό τελικό
  // Baumé. Μόνο αν λείπει (π.χ. παλιές καταχωρήσεις πριν προστεθεί αυτό το πεδίο), πέφτουμε πίσω
  // στην πιο κοντινή μέτρηση δειγματοληψίας πριν/έως την ημερομηνία τρύγου, σημειωμένη με *.
  let anyApproxBaume=false;
  const harvestInfoByBlock={};
  if(showHarvestCol){
    blocks.forEach(b=>{
      const harvestDates=Object.keys(actualMap[b]||{}).sort();
      if(!harvestDates.length)return;
      const baumeDates=Object.keys(blockMap[b]||{}).filter(d=>{
        const v=blockMap[b][d].baume;
        return v!==null&&v!==undefined;
      }).sort();
      harvestInfoByBlock[b]=harvestDates.map(hd=>{
        const directBaume=(actualBaumeMap[b]&&actualBaumeMap[b][hd]!==undefined&&actualBaumeMap[b][hd]!==null)?actualBaumeMap[b][hd]:null;
        if(directBaume!==null)return{date:hd,baume:directBaume,approx:false};
        let best=null;
        for(const bd of baumeDates){if(bd<=hd)best=bd;else break;}
        let approx=false;
        if(best===null&&baumeDates.length){best=baumeDates.find(bd=>bd>hd)||null;approx=true;}
        else if(best!==null&&best!==hd){approx=true;}
        if(approx)anyApproxBaume=true;
        const baume=best!==null?blockMap[b][best].baume:null;
        return{date:hd,baume,approx};
      });
    });
  }

  // Σύνολα ανά ποικιλία (άθροισμα των στηλών Πρόβλεψη/Πραγματική στο τέλος του πίνακα)
  const forecastTotal=blocks.reduce((s,b)=>s+(forecastByBlock[b]||0),0);
  const actualTotal=blocks.reduce((s,b)=>s+(actualByBlock[b]||0),0);
  const round1=n=>Math.round(n*10)/10;

  return `<div class="matrix-scroll"><table class="matrix">
    <thead><tr><th>Block</th><th class="forecast-col">Πρόβλεψη (Kg)</th><th class="forecast-col actual-col">Πραγματική ποσότητα (Kg)</th>${dates.map(d=>`<th>${fmtShortDate(d)}</th>`).join('')}${showHarvestCol?'<th class="forecast-col">Τρύγος (ημ/νία · Baumé)</th>':''}</tr></thead>
    <tbody>
      ${blocks.map(b=>{
        const blockId=rowIndex[b];
        const sched=blockId?scheduleByBlock[blockId]:null;
        let rowCls='';
        if(sched)rowCls=(sched.actual_kg!==null&&sched.actual_kg!==undefined)?' row-harvested':' row-scheduled';
        const escVariety=(variety||'').replace(/'/g,"\\'");
        const escLabel=b.replace(/'/g,"\\'");
        const clickAttr=blockId?` onclick="openScheduleModal('${escVariety}','${escLabel}')" title="Κλικ για προγραμματισμό/καταχώρηση τρύγου"`:'';
        return `<tr class="${rowCls.trim()}">
        <td class="block-cell"${clickAttr}>${b}</td>
        <td class="forecast-col">${forecastByBlock[b]!==undefined?forecastByBlock[b]:'<span class="cell-empty">—</span>'}</td>
        <td class="forecast-col actual-col">${actualByBlock[b]!==undefined?actualByBlock[b]:'<span class="cell-empty">—</span>'}</td>
        ${dates.map(d=>{
          const rec=(blockMap[b]||{})[d];
          if(!rec||rec[metric]===null||rec[metric]===undefined)return`<td><span class="cell-empty">—</span></td>`;
          const otherFields=allFields.filter(f=>f!==metric);
          const detailHTML=otherFields.map(f=>rec[f]!==null&&rec[f]!==undefined?`${labels[f]}: ${rec[f]}${units[f]}`:null).filter(Boolean).join('<br>');
          return `<td><div class="cell-val" onclick="event.stopPropagation();toggleCell(this.parentElement)">${rec[metric]}${units[metric]}
            <div class="cell-detail" style="display:none;">${detailHTML||'—'}</div>
          </div></td>`;
        }).join('')}
        ${showHarvestCol?`<td class="forecast-col">${(harvestInfoByBlock[b]||[]).length?harvestInfoByBlock[b].map(e=>`${fmtShortDate(e.date)}: ${e.baume!==null&&e.baume!==undefined?e.baume+'°'+(e.approx?' *':''):'<span class="cell-empty">—</span>'}`).join('<br>'):'<span class="cell-empty">—</span>'}</td>`:''}
      </tr>`;}).join('')}
      <tr>
        <td style="font-weight:700;border-top:2px solid var(--ink);">Σύνολο</td>
        <td class="forecast-col" style="font-weight:700;border-top:2px solid var(--ink);">${forecastTotal?round1(forecastTotal):'<span class="cell-empty">—</span>'}</td>
        <td class="forecast-col actual-col" style="font-weight:700;border-top:2px solid var(--ink);">${actualTotal?round1(actualTotal):'<span class="cell-empty">—</span>'}</td>
        ${dates.map(()=>'<td style="border-top:2px solid var(--ink);"></td>').join('')}
        ${showHarvestCol?'<td style="border-top:2px solid var(--ink);"></td>':''}
      </tr>
    </tbody>
  </table></div>${showHarvestCol&&anyApproxBaume?'<div style="font-size:11px;color:var(--ink-faint);margin-top:6px;font-family:-apple-system,sans-serif;">* το Baumé δεν καταχωρήθηκε στο ημερολόγιο τρύγου για αυτή τη φάση — δείχνεται η πλησιέστερη διαθέσιμη μέτρηση δειγματοληψίας.</div>':''}`;
}

// ─── Σύνοψη τρύγου (πάνω από τους πίνακες ποικιλιών): συνολικά κιλά της επιλεγμένης χρονιάς
// + γράφημα πίτας με το ποσοστό κάθε ποικιλίας στο σύνολο της παραγωγής. Βασίζεται στο ήδη
// year-filtered actualData (άθροισμα harvest_schedule.actual_kg ανά block), ίδια πηγή με τη
// στήλη «Πραγματική ποσότητα (Kg)» των πινάκων, ώστε οι αριθμοί να ταιριάζουν παντού.
function computeYearHarvestTotals(){
  const totals={}; // variety -> kg
  let grand=0;
  Object.keys(actualData).forEach(variety=>{
    let sum=0;
    Object.keys(actualData[variety]).forEach(block=>{
      Object.values(actualData[variety][block]).forEach(kg=>{sum+=(kg||0);});
    });
    if(sum>0){totals[variety]=sum;grand+=sum;}
  });
  return{totals,grand};
}

function buildPieSVG(slices,total){
  const R=54,C=2*Math.PI*R;
  let offset=0;
  const circles=slices.map(s=>{
    const frac=total>0?s.value/total:0;
    const len=frac*C;
    const circle=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${s.color}" stroke-width="24"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 80 80)">
      <title>${s.label}: ${Math.round(s.value*10)/10} kg (${(frac*100).toFixed(1)}%)</title>
    </circle>`;
    offset+=len;
    return circle;
  }).join('');
  return `<svg viewBox="0 0 160 160" style="width:120px;height:120px;flex-shrink:0;">${circles}</svg>`;
}

function renderHarvestSummary(){
  const{totals,grand}=computeYearHarvestTotals();
  if(!grand)return'';
  const varieties=Object.keys(totals).sort((a,b)=>totals[b]-totals[a]);
  const round1=n=>Math.round(n*10)/10;
  const slices=varieties.map((v,i)=>({label:v,value:totals[v],color:CHART_COLORS[i%CHART_COLORS.length]}));
  const legendRows=varieties.map((v,i)=>{
    const pct=grand>0?(totals[v]/grand*100):0;
    return `<div class="pie-legend-row">
      <span class="pie-swatch" style="background:${CHART_COLORS[i%CHART_COLORS.length]}"></span>
      <span class="pie-legend-name">${v}</span>
      <span class="pie-legend-val">${round1(totals[v]).toLocaleString('el-GR')} kg</span>
      <span class="pie-legend-pct">${pct.toFixed(1)}%</span>
    </div>`;
  }).join('');
  return `<div class="summary-card">
    <div class="summary-hdr">
      <div>
        <div class="summary-title">Σύνολο Τρύγου${selectedYear?' — '+selectedYear:''}</div>
        <div class="summary-total">${round1(grand).toLocaleString('el-GR')}<span class="summary-unit"> Kg</span></div>
      </div>
      ${buildPieSVG(slices,grand)}
    </div>
    <div class="pie-legend">${legendRows}</div>
  </div>`;
}

// ─── Μικρό γράφημα προόδου τρύγου: πόσα blocks τρυγήθηκαν / είναι προγραμματισμένα / απομένουν,
// σε όλο το οινοποιείο (ίδια dedup λογική με το scheduleByBlock που ήδη υπολογίζεται πιο πάνω —
// ταιριάζει 1-προς-1 με τους αριθμούς του widget «Πρόγραμμα Τρύγου» στο reports.html).
function renderBlockProgress(){
  const total=allBlocksCount;
  if(!total)return'';
  let done=0,sched=0;
  Object.values(scheduleByBlock).forEach(s=>{
    if(s.actual_kg!==null&&s.actual_kg!==undefined)done++;
    else sched++;
  });
  const remain=Math.max(0,total-done-sched);
  const pct=n=>total>0?(n/total*100):0;
  return `<div class="progress-card">
    <div class="progress-title">Πρόοδος Τρύγου — Blocks</div>
    <div class="progress-bar">
      ${done?`<div class="progress-seg done" style="width:${pct(done)}%"></div>`:''}
      ${sched?`<div class="progress-seg sched" style="width:${pct(sched)}%"></div>`:''}
      ${remain?`<div class="progress-seg remain" style="width:${pct(remain)}%"></div>`:''}
    </div>
    <div class="progress-stats">
      <div class="progress-stat done"><b>${done}</b>Τρυγήθηκαν</div>
      <div class="progress-stat sched"><b>${sched}</b>Προγραμματισμένα</div>
      <div class="progress-stat"><b>${remain}</b>Απομένουν</div>
      <div class="progress-stat"><b>${total}</b>Σύνολο blocks</div>
    </div>
  </div>`;
}

}

function render(){
  const yearHTML=renderYearSelector();
  // Ένωση ποικιλιών από δειγματοληψίες ΚΑΙ από τρύγο — ένα block μπορεί να τρυγήθηκε (με kg/Baumé
  // καταχωρημένα απευθείας στο ημερολόγιο τρύγου) χωρίς να έχει ποτέ δειγματοληψία στο admin.html,
  // οπότε δεν πρέπει να λείπει ολόκληρη η ποικιλία από το report μόνο επειδή δεν έγινε sampling.
  const varieties=[...new Set([...Object.keys(varietyData),...Object.keys(actualData)])].sort((a,b)=>a.localeCompare(b,'el'));
  if(!varieties.length){
    document.getElementById('content').innerHTML=yearHTML+'<div class="no-data">Δεν υπάρχουν δεδομένα για αυτή τη χρονιά.</div>';
    return;
  }

  const progressHTML=renderBlockProgress();
  const summaryHTML=renderHarvestSummary();
  const scheduleCardHTML=renderHarvestScheduleCard();
  const statsRowHTML=`<div class="stats-row">
    <div class="gc-schedule">${scheduleCardHTML}</div>
    <div class="gc-summary">${summaryHTML}</div>
    <div class="gc-progress">${progressHTML}</div>
  </div>`;
  const measurementsLblHTML='<p class="section-title" style="margin:0 0 12px;">Μετρήσεις</p>';

  const html=varieties.map(variety=>{
    const blockMap=varietyData[variety]||{};
    const actualMap=actualData[variety]||{};
    const actualBaumeMap=actualBaumeData[variety]||{};
    const mode=sectionMode[variety]||'chem';
    const chemSection=`<div class="section-hdr">
        <span class="section-title">Χημικές αναλύσεις</span>
        <div class="toggle-row">
          ${['baume','tartaricAcid','ph'].map(m=>`<button class="toggle-btn${chemMetric===m?' on':''}" onclick="setChemMetric('${m}')">${CHEM_LABELS[m]}</button>`).join('')}
          <button class="btn-chart" onclick="openMetricChart('${variety.replace(/'/g,"\\'")}','${chemMetric}')">📈 Γράφημα ${CHEM_LABELS[chemMetric]}</button>
        </div>
      </div>
      ${buildMatrixHTML(blockMap, chemMetric, ['baume','tartaricAcid','ph'], CHEM_LABELS, CHEM_UNITS, actualMap, true, actualBaumeMap, variety)}`;
    const agroSection=`<div class="section-hdr">
        <span class="section-title">Αγρονομικές αναλύσεις</span>
        <div class="toggle-row">
          ${['berryWeight','juiceYield'].map(m=>`<button class="toggle-btn${agroMetric===m?' on':''}" onclick="setAgroMetric('${m}')">${AGRO_LABELS[m]}</button>`).join('')}
        </div>
      </div>
      ${buildMatrixHTML(blockMap, agroMetric, ['berryWeight','juiceYield'], AGRO_LABELS, AGRO_UNITS, actualMap, false, null, variety)}`;
    return `<div class="variety-block">
      <div class="variety-title">${variety}</div>
      <div class="section-toggle">
        <button class="section-toggle-btn${mode==='chem'?' on':''}" onclick="setSection('${variety.replace(/'/g,"\\'")}','chem')">Χημικές αναλύσεις</button>
        <button class="section-toggle-btn${mode==='agro'?' on':''}" onclick="setSection('${variety.replace(/'/g,"\\'")}','agro')">Αγρονομικές αναλύσεις</button>
      </div>
      ${mode==='chem'?chemSection:agroSection}
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML=yearHTML+statsRowHTML+measurementsLblHTML+html;
}

// ─── Προγραμματισμός τρύγου από τον πίνακα (modal στο κλικ πάνω στον παραγωγό/block) ───
function latestYieldEstFor(variety,rowLabel){
  const blockMap=(varietyData[variety]||{})[rowLabel];
  if(!blockMap)return null;
  const dates=Object.keys(blockMap).sort();
  for(let i=dates.length-1;i>=0;i--){
    const v=blockMap[dates[i]].yieldEst;
    if(v!==null&&v!==undefined)return v;
  }
  return null;
}

function openScheduleModal(variety,rowLabel){
  const blockId=(rowBlockIndex[variety]||{})[rowLabel];
  if(!blockId)return;
  const s=scheduleByBlock[blockId];
  const today=new Date().toISOString().slice(0,10);
  let bodyHTML='';
  if(!s){
    const est=latestYieldEstFor(variety,rowLabel);
    bodyHTML=`
      <div class="sched-row"><label>Ημερομηνία τρύγου</label><input type="date" id="sm-date" value="${today}"></div>
      ${est!==null?`<div class="sched-hint">Πρόβλεψη απόδοσης: ${est} kg</div>`:''}
      <div class="sched-actions"><button onclick="submitSchedule('${blockId}')">📅 Προγραμματισμός</button></div>`;
  }else if(s.actual_kg===null||s.actual_kg===undefined){
    bodyHTML=`
      <div class="sched-meta"><span class="badge scheduled">Προγραμματισμένο</span> για ${fmtFullDate(s.scheduled_date)}${s.created_by?' · από '+s.created_by:''}</div>
      <div class="sched-row"><label>Πραγματικά kg</label><input type="number" id="sm-kg" min="0" step="0.1" placeholder="kg"></div>
      <div class="sched-row"><label>Baumé °</label><input type="number" id="sm-baume" min="0" step="0.1" placeholder="° (προαιρετικό)"></div>
      <div class="sched-actions">
        <button onclick="submitComplete('${blockId}','${s.id}')">✅ Ολοκλήρωση</button>
        ${isAdmin?`<button class="ghost" onclick="submitUnschedule('${blockId}','${s.id}')">Ακύρωση</button>`:''}
      </div>`;
  }else{
    bodyHTML=`
      <div class="sched-meta"><span class="badge done">Τρυγήθηκε</span> ${fmtFullDate(s.scheduled_date)} · ${s.actual_kg} kg${s.actual_baume!==null&&s.actual_baume!==undefined?' · Baumé '+s.actual_baume+'°':''}</div>
      ${isAdmin?`<div class="sched-row"><label>Ημερομηνία τρύγου</label><input type="date" id="sm-date" value="${s.scheduled_date||''}"></div>`:''}
      <div class="sched-row"><label>Πραγματικά kg</label><input type="number" id="sm-kg" min="0" step="0.1" value="${s.actual_kg}"></div>
      <div class="sched-row"><label>Baumé °</label><input type="number" id="sm-baume" min="0" step="0.1" value="${s.actual_baume!==null&&s.actual_baume!==undefined?s.actual_baume:''}"></div>
      <div class="sched-actions"><button onclick="submitEdit('${blockId}','${s.id}')">Αποθήκευση</button></div>`;
  }
  document.getElementById('scheduleModalContainer').innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeScheduleModal()">
      <div class="chart-modal sched-modal">
        <button class="chart-close" onclick="closeScheduleModal()">×</button>
        <div class="chart-modal-title">${rowLabel}</div>
        <div class="chart-modal-sub">${variety}</div>
        ${bodyHTML}
      </div>
    </div>`;
}
function closeScheduleModal(){document.getElementById('scheduleModalContainer').innerHTML='';}

async function submitSchedule(blockId){
  const dateInp=document.getElementById('sm-date');
  const date=dateInp?dateInp.value:'';
  if(!date){alert('Διάλεξε ημερομηνία.');return;}
  let est=null;
  for(const v of Object.keys(rowBlockIndex)){
    for(const label of Object.keys(rowBlockIndex[v])){
      if(rowBlockIndex[v][label]===blockId){est=latestYieldEstFor(v,label);break;}
    }
  }
  const{error}=await supa.from('harvest_schedule').insert({
    block_id:blockId, scheduled_date:date, estimated_kg:est, created_by:currentPersonName
  });
  if(error){alert('Σφάλμα: '+error.message);return;}
  closeScheduleModal();
  await loadAndRender();
}

async function submitComplete(blockId,scheduleId){
  const kg=document.getElementById('sm-kg').value;
  const baume=document.getElementById('sm-baume').value;
  if(!kg){alert('Γράψε τα πραγματικά kg.');return;}
  const{error}=await supa.from('harvest_schedule').update({
    actual_kg:parseFloat(kg), actual_baume:baume!==''?parseFloat(baume):null,
    updated_at:new Date().toISOString(), updated_by:currentPersonName
  }).eq('id',scheduleId);
  if(error){alert('Σφάλμα: '+error.message);return;}
  closeScheduleModal();
  await loadAndRender();
}

async function submitEdit(blockId,scheduleId){
  const kg=document.getElementById('sm-kg').value;
  const baume=document.getElementById('sm-baume').value;
  const dateInp=document.getElementById('sm-date'); // υπάρχει μόνο αν isAdmin
  if(!kg){alert('Γράψε τα πραγματικά kg.');return;}
  const updates={actual_kg:parseFloat(kg), actual_baume:baume!==''?parseFloat(baume):null, updated_at:new Date().toISOString(), updated_by:currentPersonName};
  if(dateInp){
    if(!dateInp.value){alert('Διάλεξε ημερομηνία τρύγου.');return;}
    updates.scheduled_date=dateInp.value;
  }
  const{error}=await supa.from('harvest_schedule').update(updates).eq('id',scheduleId);
  if(error){alert('Σφάλμα: '+error.message);return;}
  closeScheduleModal();
  await loadAndRender();
}

async function submitUnschedule(blockId,scheduleId){
  if(!confirm('Ακύρωση προγραμματισμού για αυτό το block;'))return;
  const{error}=await supa.from('harvest_schedule').delete().eq('id',scheduleId);
  if(error){alert('Σφάλμα: '+error.message);return;}
  closeScheduleModal();
  await loadAndRender();
}

loadData();

// ─── Γράφημα μεταβολής επιλεγμένης χημικής ανάλυσης στον χρόνο (ένα ανά block/γραμμή) ───
const CHART_COLORS=['#c99a3e','#4a6fa5','#7a9d54','#a5524a','#8e6bab','#4a9d94','#c47a3e','#5a5a8e'];

function openMetricChart(variety,metric){
  const blockMap=varietyData[variety]||{};
  const label=CHEM_LABELS[metric]||metric;
  const unit=CHEM_UNITS[metric]||'';
  document.getElementById('chartModalContainer').innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeBaumeChart()">
      <div class="chart-modal">
        <button class="chart-close" onclick="closeBaumeChart()">×</button>
        <div class="chart-modal-title">Μεταβολή ${label} — ${variety}</div>
        <div class="chart-modal-sub">${label}${unit?' ('+unit+')':''} ανά ημερομηνία δειγματοληψίας</div>
        ${buildMetricChartSVG(blockMap,metric,unit)}
      </div>
    </div>`;
}
function closeBaumeChart(){document.getElementById('chartModalContainer').innerHTML='';}

function buildMetricChartSVG(blockMap,metric,unit){
  const blocks=Object.keys(blockMap).sort();
  const series=blocks.map(b=>{
    const dates=Object.keys(blockMap[b]).filter(d=>{
      const v=blockMap[b][d][metric];
      return v!==null&&v!==undefined;
    }).sort();
    return{
      label:b,
      points:dates.map(d=>({d,v:parseFloat(blockMap[b][d][metric])}))
    };
  }).filter(s=>s.points.length);

  if(!series.length)return`<div class="no-data">Δεν υπάρχουν δεδομένα ${CHEM_LABELS[metric]||metric}.</div>`;

  const cards=series.map((s,si)=>{
    const col=CHART_COLORS[si%CHART_COLORS.length];
    return`<div class="chart-card">
      <div class="chart-card-title">${s.label}</div>
      ${buildSingleLineSVG(s.points,col,unit)}
    </div>`;
  }).join('');

  return`<div class="chart-grid">${cards}</div>`;
}

function buildSingleLineSVG(points,col,unit){
  unit=unit||'';
  const W=340,H=190,padL=38,padR=14,padT=14,padB=36;
  const plotW=W-padL-padR,plotH=H-padT-padB;

  if(points.length===1){
    // Ένα μόνο σημείο — δείξε το χωρίς γραμμή
    const v=points[0].v;
    return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#ccc" stroke-width="1"/>
      <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#ccc" stroke-width="1"/>
      <circle cx="${padL+plotW/2}" cy="${padT+plotH/2}" r="4" fill="${col}"><title>${fmtShortDate(points[0].d)}: ${v}${unit}</title></circle>
      <text x="${padL+plotW/2}" y="${padT+plotH/2-10}" text-anchor="middle" font-size="11" fill="#666" font-family="-apple-system,sans-serif">${v}${unit}</text>
      <text x="${padL+plotW/2}" y="${H-padB+16}" text-anchor="middle" font-size="10" fill="#999" font-family="-apple-system,sans-serif">${fmtShortDate(points[0].d)}</text>
    </svg>`;
  }

  let minV=Math.min(...points.map(p=>p.v)),maxV=Math.max(...points.map(p=>p.v));
  if(minV===maxV){minV-=1;maxV+=1;}
  const pad=(maxV-minV)*0.15;
  minV=Math.max(0,minV-pad);maxV=maxV+pad;

  const xFor=i=>points.length>1?padL+(i/(points.length-1))*plotW:padL+plotW/2;
  const yFor=v=>padT+plotH-((v-minV)/(maxV-minV))*plotH;

  const yTicks=3;
  const gridLines=Array.from({length:yTicks+1},(_,k)=>{
    const val=minV+(maxV-minV)*(k/yTicks);
    const y=yFor(val);
    return`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#f0f0f0" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#999" font-family="-apple-system,sans-serif">${val.toFixed(1)}</text>`;
  }).join('');

  const xLabels=points.map((p,i)=>{
    const x=xFor(i);
    return`<text x="${x}" y="${H-padB+16}" text-anchor="middle" font-size="9" fill="#999" font-family="-apple-system,sans-serif" transform="rotate(-40 ${x} ${H-padB+16})">${fmtShortDate(p.d)}</text>`;
  }).join('');

  const path=points.map((p,i)=>`${i===0?'M':'L'}${xFor(i)},${yFor(p.v)}`).join(' ');
  const dots=points.map((p,i)=>`<circle cx="${xFor(i)}" cy="${yFor(p.v)}" r="3" fill="${col}"><title>${fmtShortDate(p.d)}: ${p.v}${unit}</title></circle>`).join('');

  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#ccc" stroke-width="1"/>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#ccc" stroke-width="1"/>
    ${gridLines}
    ${xLabels}
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>
    ${dots}
  </svg>`;
}
</script>
