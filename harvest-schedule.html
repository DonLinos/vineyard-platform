<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Προγραμματισμός Τρύγου</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  :root{
    --ink:#f2ede1; --ink-dim:#b9c2b3; --ink-faint:#7c8a78; --bg:#1d2620; --card:#26312a;
    --line:#3a473e; --gold:#c99a3e; --gold-dim:#8f6f2c; --green:#4f9e5c; --orange:#d9a057; --danger:#d97757;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;}
  body{padding:20px 16px 60px;}
  .wrap{max-width:640px;margin:0 auto;}
  .back-link{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--ink-dim);text-decoration:none;}
  .topbar-title{font-family:Georgia,serif;font-weight:400;font-size:22px;margin:0 0 2px;}
  .topbar-sub{font-size:13px;color:var(--ink-faint);margin:0 0 22px;}
  h2.section{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:26px 0 10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;}
  .block-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .block-name{font-size:15px;font-weight:600;}
  .block-meta{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .badge.ready{background:rgba(201,154,62,.18);color:var(--gold);}
  .badge.scheduled{background:rgba(217,160,87,.18);color:var(--orange);}
  .badge.done{background:rgba(79,158,92,.18);color:var(--green);}
  .badge.missed{background:rgba(217,119,87,.18);color:var(--danger);}
  .row-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  input[type="date"],input[type="number"]{
    background:#18201b;border:1px solid var(--line);border-radius:6px;color:var(--ink);
    padding:8px 10px;font-size:14px;outline:none;
  }
  input[type="date"]:focus,input[type="number"]:focus{border-color:var(--gold-dim);}
  button{
    background:var(--gold);color:#241a08;border:none;border-radius:6px;
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  button:hover{background:#dcaa4c;}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim);}
  button.ghost:hover{border-color:var(--gold-dim);color:var(--ink);}
  button.small{padding:6px 10px;font-size:12px;}
  .no-data{color:var(--ink-faint);font-size:13px;padding:14px 0;text-align:center;}
  .date-group{margin-bottom:16px;}
  .date-heading{font-size:13px;color:var(--ink-dim);margin:0 0 6px;font-weight:600;}
  .thresholds-toggle{font-size:12px;color:var(--ink-faint);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;margin-top:24px;}
  .thresholds-panel{display:none;margin-top:10px;}
  .thresholds-panel.open{display:block;}
  .thresh-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .thresh-row:last-child{border-bottom:none;}
  .thresh-row input{width:70px;}
  .variety-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .vtab{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--ink-dim);white-space:nowrap;}
  .vtab:hover{border-color:var(--gold-dim);}
  .vtab.on{background:var(--gold);color:#241a08;border-color:var(--gold);font-weight:600;}
  input[type="number"].baume-input{width:100px;}

  /* ─── Σύνοψη κιλών/blocks ─── */
  .stats-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px;}
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;}
  .stat-val{font-size:20px;font-weight:700;}
  .stat-val.done{color:var(--green);}
  .stat-val.sched{color:var(--orange);}
  .stat-val.remain{color:var(--ink-dim);}
  .stat-sub{font-size:11px;color:var(--ink-dim);margin-top:2px;min-height:14px;}
  .stat-lbl{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;margin-top:4px;}

  /* ─── Μεγάλο ημερολόγιο τρύγου ─── */
  .cal-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px;}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-nav button{background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:5px 10px;border-radius:6px;font-size:13px;cursor:pointer;}
  .cal-nav button:hover{border-color:var(--gold-dim);color:var(--ink);}
  .cal-month-lbl{font-size:14px;font-weight:600;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{font-size:10px;text-align:center;color:var(--ink-faint);padding-bottom:4px;text-transform:uppercase;}
  .cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink-dim);background:#1c251f;gap:1px;}
  .cal-day.empty{visibility:hidden;}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--gold);}
  .cal-day.has-entries{cursor:pointer;}
  .cal-day.has-sched{background:rgba(217,160,87,.22);}
  .cal-day.has-done{background:rgba(79,158,92,.22);}
  .cal-day.has-both{background:linear-gradient(135deg, rgba(217,160,87,.28) 50%, rgba(79,158,92,.28) 50%);}
  .cal-day.selected{box-shadow:inset 0 0 0 2px var(--ink);}
  .cal-day-num{font-weight:600;}
  .cal-day-kg{font-size:8px;font-weight:700;line-height:1.2;white-space:nowrap;}
  .cal-day-kg.kg-white{color:#e8dfc8;}
  .cal-day-kg.kg-red{color:#e08a72;}
  .cal-day.has-sched .cal-day-num,.cal-day.has-done .cal-day-num,.cal-day.has-both .cal-day-num{color:var(--ink);}
  .cal-legend{display:flex;gap:14px;font-size:11px;color:var(--ink-faint);margin-top:12px;flex-wrap:wrap;}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}
  .cal-legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .cal-day-details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;}
  .cal-day-details-title{font-size:13px;font-weight:600;margin-bottom:8px;}
  .cal-detail-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .cal-detail-row:last-child{border-bottom:none;}
  .cal-detail-sym{font-weight:700;margin-right:4px;}
  .cal-detail-sym.sym-done{color:var(--green);}
  .cal-detail-sym.sym-sched{color:var(--orange);}
  .cal-detail-sym.sym-missed{color:var(--danger);}
  .cal-detail-name{font-weight:600;}
  .cal-detail-meta{font-size:11px;color:var(--ink-dim);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="#" id="backLink">← Πίσω στα reports</a>
  <h1 class="topbar-title" id="topbarTitle">Προγραμματισμός Τρύγου</h1>
  <p class="topbar-sub" id="topbarSub"></p>
  <div id="content"><div class="no-data">Φόρτωση δεδομένων...</div></div>

  <button class="thresholds-toggle" id="threshToggle">⚙️ Ρύθμιση ορίων Baumé ανά ποικιλία</button>
  <div class="thresholds-panel" id="threshPanel"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const urlParams=new URLSearchParams(window.location.search);
const WINERY_ID=urlParams.get('winery_id');
document.getElementById('backLink').href='reports.html?winery_id='+WINERY_ID;

const DEFAULT_THRESHOLD=12;
let blocksData=[];      // {id, block_code, variety, vineyardCode, latestBaume, latestBaumeDate, latestYieldEst}
let thresholdsByVariety={};
let scheduleByBlock={};  // block_id -> schedule row (latest / open one)
let currentPersonName='';
let isAdmin=false; // true μόνο για πραγματικό Supabase login (σύμβουλος) — όχι για access code
let selectedVarietyTab='__all__'; // καρτέλα ποικιλίας που φιλτράρει Έτοιμα/Προγραμματισμένα/Ολοκληρωμένα

let allScheduleRows=[]; // ΟΛΕΣ οι γραμμές harvest_schedule (όχι deduped ανά block) — για το ημερολόγιο
const MONTH_NAMES_EL=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const DOW_EL=['Δε','Τρ','Τε','Πε','Πα','Σα','Κυ'];
// Ταξινόμηση ποικιλιών σε λευκές/κόκκινες με βάση τον κωδικό τους (π.χ. "SRH — Syrah" -> "SRH"),
// για το σύνολο κιλών ανά ημέρα στο κουτάκι του ημερολογίου. Ενημέρωσε τις λίστες αν προστεθεί
// νέα ποικιλία που δεν καλύπτεται.
const WHITE_VARIETY_CODES=new Set(['SVB','XNS','PRM','VAS']);
const RED_VARIETY_CODES=new Set(['YND','SRH','ZFD','MTR','GRN','MSF','CSF','CSV','LFK']);
function varietyCode(varietyStr){
  if(!varietyStr)return'';
  return varietyStr.split(/\s*[—–-]\s*/)[0].trim().toUpperCase();
}
function varietyColorGroup(varietyStr){
  const code=varietyCode(varietyStr);
  if(WHITE_VARIETY_CODES.has(code))return'white';
  if(RED_VARIETY_CODES.has(code))return'red';
  return null;
}
const _today=new Date();
let calYear=_today.getFullYear();
let calMonth=_today.getMonth(); // 0-indexed
let selectedCalDay=null;

function fmtDate(d){
  if(!d)return'—';
  const dt=new Date(d+'T00:00:00');
  return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear();
}

async function requireAuthAndLoad(){
  if(!WINERY_ID){document.getElementById('content').innerHTML='<div class="no-data">Λείπει winery_id — επίστρεψε στη σύνδεση.</div>';return;}
  const access=await requireAccess(supa,WINERY_ID);
  if(!access)return;
  currentPersonName=access.personName;
  isAdmin=access.method==='auth';

  const{data:winery}=await supa.from('wineries').select('name').eq('id',WINERY_ID).maybeSingle();
  document.getElementById('topbarSub').textContent=(winery?winery.name:'')+' — Προγραμματισμός & κατάσταση τρύγου ανά block';

  await loadAll();
  render();
}

async function loadAll(){
  const{data:areasRows}=await supa.from('areas').select('id,name').eq('winery_id',WINERY_ID);
  const areaIds=(areasRows||[]).map(a=>a.id);
  if(!areaIds.length){blocksData=[];return;}

  const{data:vineyardsRows}=await supa.from('vineyards').select('id,vineyard_code').in('area_id',areaIds);
  const vineyardCodeById={};
  (vineyardsRows||[]).forEach(v=>{vineyardCodeById[v.id]=v.vineyard_code;});

  const{data:blockRows}=await supa.from('blocks').select('id,block_code,variety,vineyard_id').in('area_id',areaIds);
  const blockIds=(blockRows||[]).map(b=>b.id);
  if(!blockIds.length){blocksData=[];return;}

  const{data:estRows}=await supa.from('estimation_observations').select('*').in('block_id',blockIds);
  const{data:visitRows}=await supa.from('visits').select('id,visit_date').eq('winery_id',WINERY_ID);
  const visitDateById={};
  (visitRows||[]).forEach(v=>{visitDateById[v.id]=v.visit_date;});

  const latestByBlock={};
  (estRows||[]).forEach(r=>{
    const date=r.observed_date||visitDateById[r.visit_id]||null;
    if(!date)return;
    const prev=latestByBlock[r.block_id];
    if(!prev||date>prev.date){
      latestByBlock[r.block_id]={date,baume:r.baume,yieldEst:r.yield_est_kg_ha};
    }
  });

  const{data:schedRows}=await supa.from('harvest_schedule').select('*').in('block_id',blockIds).order('scheduled_date',{ascending:true});
  allScheduleRows=schedRows||[];
  scheduleByBlock={};
  (schedRows||[]).forEach(s=>{
    // κρατάμε το πιο πρόσφατο ανοιχτό (χωρίς actual_kg) ή αλλιώς το τελευταίο ολοκληρωμένο
    const prev=scheduleByBlock[s.block_id];
    if(!prev){scheduleByBlock[s.block_id]=s;return;}
    const prevOpen=(prev.actual_kg===null||prev.actual_kg===undefined);
    const curOpen=(s.actual_kg===null||s.actual_kg===undefined);
    if(curOpen&&!prevOpen)scheduleByBlock[s.block_id]=s;
    else if(curOpen===prevOpen&&s.scheduled_date>prev.scheduled_date)scheduleByBlock[s.block_id]=s;
  });

  const{data:threshRows}=await supa.from('variety_thresholds').select('*').eq('winery_id',WINERY_ID);
  thresholdsByVariety={};
  (threshRows||[]).forEach(t=>{thresholdsByVariety[t.variety]=t.baume_threshold;});

  blocksData=(blockRows||[]).map(b=>{
    const est=latestByBlock[b.id];
    return{
      id:b.id,
      blockCode:b.block_code,
      variety:b.variety||'—',
      vineyardCode:vineyardCodeById[b.vineyard_id]||'',
      latestBaume:est?est.baume:null,
      latestBaumeDate:est?est.date:null,
      latestYieldEst:est?est.yieldEst:null
    };
  });
}

function thresholdFor(variety){
  return thresholdsByVariety[variety]!==undefined?thresholdsByVariety[variety]:DEFAULT_THRESHOLD;
}

// Καρτέλες ποικιλιών, ώστε να μη χρειάζεται να σκρολάρεις ανάμεσα σε όλες τις ποικιλίες μαζί
function varietyTabsHTML(){
  const varieties=[...new Set(blocksData.map(b=>b.variety))].sort((a,b)=>a.localeCompare(b,'el'));
  if(varieties.length<=1)return'';
  const tabs=['__all__',...varieties];
  return`<div class="variety-tabs">${tabs.map(v=>`<button class="vtab${selectedVarietyTab===v?' on':''}" onclick="setVarietyTab('${v.replace(/'/g,"\\'")}')">${v==='__all__'?'Όλες':v}</button>`).join('')}</div>`;
}
function setVarietyTab(v){selectedVarietyTab=v;render();}

// ─── Σύνοψη κιλών/blocks (σέβεται την επιλεγμένη καρτέλα ποικιλίας) ───
function computeStats(visibleBlocks){
  let doneCount=0,doneKg=0,schedCount=0,schedKg=0;
  visibleBlocks.forEach(b=>{
    const s=scheduleByBlock[b.id];
    if(s&&s.actual_kg!==null&&s.actual_kg!==undefined){doneCount++;doneKg+=(parseFloat(s.actual_kg)||0);}
    else if(s){schedCount++;schedKg+=(parseFloat(s.estimated_kg)||0);}
  });
  const remainCount=Math.max(0,visibleBlocks.length-doneCount-schedCount);
  return{doneCount,doneKg,schedCount,schedKg,remainCount};
}

function statsHTML(st){
  const round1=n=>Math.round(n*10)/10;
  return `<div class="stats-card">
    <div class="stats-row">
      <div><div class="stat-val done">${st.doneCount}</div><div class="stat-sub">${st.doneKg?round1(st.doneKg)+' kg':'—'}</div><div class="stat-lbl">Τρυγήθηκαν</div></div>
      <div><div class="stat-val sched">${st.schedCount}</div><div class="stat-sub">${st.schedKg?round1(st.schedKg)+' kg (πρόβλεψη)':'—'}</div><div class="stat-lbl">Προγραμματισμένα</div></div>
      <div><div class="stat-val remain">${st.remainCount}</div><div class="stat-sub">&nbsp;</div><div class="stat-lbl">Απομένουν</div></div>
    </div>
  </div>`;
}

// ─── Μεγάλο ημερολόγιο: ΟΛΕΣ οι φάσεις τρύγου (allScheduleRows) ομαδοποιημένες ανά ημερομηνία,
// φιλτραρισμένες στα blocks που είναι ορατά με την τρέχουσα καρτέλα ποικιλίας ───
function buildDatesMap(visibleBlocks){
  const visibleIds=new Set(visibleBlocks.map(b=>b.id));
  const blockMeta={};
  blocksData.forEach(b=>{blockMeta[b.id]=b;});
  const todayStr=new Date().toISOString().slice(0,10);
  const datesMap={};
  allScheduleRows.forEach(s=>{
    if(!visibleIds.has(s.block_id))return;
    if(!s.scheduled_date)return;
    const b=blockMeta[s.block_id];
    if(!b)return;
    const done=(s.actual_kg!==null&&s.actual_kg!==undefined);
    // "Πέρασε η μέρα": ήταν προγραμματισμένο, η ημερομηνία πέρασε, και ακόμα δεν καταχωρήθηκαν
    // πραγματικά kg — ξεχωριστό από "Προγραμματισμένο" (μελλοντική/σημερινή ημερομηνία).
    const missed=!done&&s.scheduled_date<todayStr;
    const kgVal=parseFloat(done?s.actual_kg:s.estimated_kg)||0;
    const colorGroup=varietyColorGroup(b.variety);
    if(!datesMap[s.scheduled_date])datesMap[s.scheduled_date]={hasSched:false,hasDone:false,hasMissed:false,kgWhite:0,kgRed:0,entries:[]};
    const dm=datesMap[s.scheduled_date];
    if(done)dm.hasDone=true;
    else if(missed)dm.hasMissed=true;
    else dm.hasSched=true;
    if(colorGroup==='white')dm.kgWhite+=kgVal;
    else if(colorGroup==='red')dm.kgRed+=kgVal;
    dm.entries.push({
      name:b.blockCode+(b.vineyardCode?' · '+b.vineyardCode:''),
      variety:b.variety,
      done,
      missed,
      kg:done?s.actual_kg:s.estimated_kg,
      baume:done?s.actual_baume:null
    });
  });
  return datesMap;
}

function calendarHTML(datesMap){
  const first=new Date(calYear,calMonth,1);
  const startDow=(first.getDay()+6)%7; // 0=Δευτέρα
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=new Date().toISOString().slice(0,10);
  let cells=DOW_EL.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startDow;i++)cells+='<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const info=datesMap[dateStr];
    let cls='cal-day';
    if(dateStr===todayStr)cls+=' today';
    if(dateStr===selectedCalDay)cls+=' selected';
    let kgHTML='';
    if(info){
      cls+=' has-entries';
      // Χρώμα κουτιού: πορτοκαλί=προγραμματισμένο, πράσινο=τρυγήθηκε, gradient αν έχει και τα
      // δύο. Το "πέρασε η μέρα χωρίς καταχώρηση" ΔΕΝ αλλάζει το χρώμα του κουτιού (θα έδειχνε
      // σαν χαλασμένη/αποτυχημένη μέρα) — φαίνεται με ✗ δίπλα στο όνομα στις λεπτομέρειες.
      const hasPending=info.hasSched||info.hasMissed;
      if(hasPending&&info.hasDone)cls+=' has-both';
      else if(info.hasDone)cls+=' has-done';
      else if(hasPending)cls+=' has-sched';
      const rW=Math.round(info.kgWhite),rR=Math.round(info.kgRed);
      if(rW)kgHTML+=`<span class="cal-day-kg kg-white">W: ${rW} Kg</span>`;
      if(rR)kgHTML+=`<span class="cal-day-kg kg-red">R: ${rR} Kg</span>`;
    }
    cells+=`<div class="${cls}"${info?` onclick="selectCalDay('${dateStr}')"`:''}><span class="cal-day-num">${d}</span>${kgHTML}</div>`;
  }
  const detailsHTML=(selectedCalDay&&datesMap[selectedCalDay])?dayDetailsHTML(selectedCalDay,datesMap[selectedCalDay]):'';
  return `<div class="cal-card">
    <div class="cal-nav">
      <button onclick="navMonth(-1)">‹</button>
      <span class="cal-month-lbl">${MONTH_NAMES_EL[calMonth]} ${calYear}</span>
      <button onclick="navMonth(1)">›</button>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span><i class="cal-legend-dot" style="background:var(--orange);"></i>Προγραμματισμένο</span>
      <span><i class="cal-legend-dot" style="background:var(--green);"></i>Τρυγήθηκε</span>
      <span>W=Λευκές, R=Κόκκινες</span>
    </div>
    ${detailsHTML}
  </div>`;
}

function dayDetailsHTML(dateStr,info){
  return `<div class="cal-day-details">
    <div class="cal-day-details-title">📍 ${fmtDate(dateStr)}</div>
    ${info.entries.map(e=>{
      const sym=e.done?'✓':(e.missed?'✗':'−');
      const symCls=e.done?'sym-done':(e.missed?'sym-missed':'sym-sched');
      const badgeClass=e.done?'done':(e.missed?'missed':'scheduled');
      const badgeText=e.done?'Τρυγήθηκε':(e.missed?'Δεν καταχωρήθηκε':'Προγραμματισμένο');
      return `<div class="cal-detail-row">
      <div><div class="cal-detail-name"><span class="cal-detail-sym ${symCls}">${sym}</span>${e.name}</div><div class="cal-detail-meta">${e.variety||''}</div></div>
      <div style="text-align:right;">
        <span class="badge ${badgeClass}">${badgeText}</span>
        <div class="cal-detail-meta">${e.kg!==null&&e.kg!==undefined?e.kg+' kg':''}${e.baume!==null&&e.baume!==undefined?' · '+e.baume+'°':''}</div>
      </div>
    </div>`;}).join('')}
  </div>`;
}

function navMonth(delta){
  calMonth+=delta;
  if(calMonth<0){calMonth=11;calYear--;}
  else if(calMonth>11){calMonth=0;calYear++;}
  selectedCalDay=null;
  render();
}

function selectCalDay(d){
  selectedCalDay=(selectedCalDay===d)?null:d;
  render();
}

function render(){
  const el=document.getElementById('content');
  const tabsHTML=varietyTabsHTML();
  if(!blocksData.length){el.innerHTML=tabsHTML+'<div class="no-data">Δεν βρέθηκαν blocks.</div>';renderThresholds();return;}

  const visibleBlocks=selectedVarietyTab==='__all__'?blocksData:blocksData.filter(b=>b.variety===selectedVarietyTab);

  const ready=[], scheduled=[], done=[];
  visibleBlocks.forEach(b=>{
    const sched=scheduleByBlock[b.id];
    if(sched&&sched.actual_kg!==null&&sched.actual_kg!==undefined){done.push(b);}
    else if(sched){scheduled.push(b);}
    else{
      const th=thresholdFor(b.variety);
      if(b.latestBaume!==null&&b.latestBaume!==undefined&&b.latestBaume>=th)ready.push(b);
    }
  });

  let html=tabsHTML;

  html+=statsHTML(computeStats(visibleBlocks));
  html+=calendarHTML(buildDatesMap(visibleBlocks));

  html+='<h2 class="section">🍇 Έτοιμα για προγραμματισμό ('+ready.length+')</h2>';
  html+=ready.length?ready.map(b=>readyCard(b)).join(''):'<div class="no-data">Κανένα block πάνω από το όριο Baumé αυτή τη στιγμή.</div>';

  html+='<h2 class="section">📅 Προγραμματισμένα ('+scheduled.length+')</h2>';
  if(scheduled.length){
    const byDate={};
    scheduled.forEach(b=>{
      const d=scheduleByBlock[b.id].scheduled_date;
      (byDate[d]=byDate[d]||[]).push(b);
    });
    Object.keys(byDate).sort().forEach(d=>{
      html+='<div class="date-group"><p class="date-heading">'+fmtDate(d)+'</p>';
      html+=byDate[d].map(b=>scheduledCard(b)).join('');
      html+='</div>';
    });
  }else{
    html+='<div class="no-data">Δεν υπάρχουν προγραμματισμένα blocks.</div>';
  }

  html+='<h2 class="section">✅ Ολοκληρωμένα ('+done.length+')</h2>';
  html+=done.length?done.map(b=>doneCard(b)).join(''):'<div class="no-data">Κανένα ακόμα.</div>';

  el.innerHTML=html;
  renderThresholds();
}

function readyCard(b){
  return `<div class="card">
    <div class="block-row">
      <div>
        <div class="block-name">${b.blockCode}${b.vineyardCode?' · '+b.vineyardCode:''}</div>
        <div class="block-meta">${b.variety} · Baumé ${b.latestBaume}° (${fmtDate(b.latestBaumeDate)}) — όριο ${thresholdFor(b.variety)}°</div>
      </div>
      <span class="badge ready">Έτοιμο</span>
    </div>
    <div class="row-actions">
      <input type="date" id="date-${b.id}" value="${new Date().toISOString().slice(0,10)}">
      <button class="small" onclick="scheduleBlock('${b.id}')">📅 Προγραμματισμός</button>
    </div>
    <div class="row-actions">
      <button class="small ghost" onclick="toggleQuickHarvest('${b.id}')" id="qh-toggle-${b.id}">✅ Ήδη τρυγήθηκε</button>
    </div>
    <div class="row-actions" id="qh-form-${b.id}" style="display:none;">
      <input type="date" id="qh-date-${b.id}" value="${new Date().toISOString().slice(0,10)}">
      <input type="number" id="qh-kg-${b.id}" placeholder="Πραγματικά kg" min="0" step="0.1">
      <input type="number" class="baume-input" id="qh-baume-${b.id}" placeholder="Baumé °" min="0" step="0.1">
      <button class="small" onclick="quickHarvestBlock('${b.id}')">Καταχώρηση</button>
    </div>
  </div>`;
}

function toggleQuickHarvest(blockId){
  const form=document.getElementById('qh-form-'+blockId);
  form.style.display=(form.style.display==='none')?'flex':'none';
}

async function quickHarvestBlock(blockId){
  const date=document.getElementById('qh-date-'+blockId).value;
  const kg=document.getElementById('qh-kg-'+blockId).value;
  const baume=document.getElementById('qh-baume-'+blockId).value;
  if(!date){alert('Διάλεξε ημερομηνία.');return;}
  if(!kg){alert('Γράψε τα πραγματικά kg.');return;}
  const b=blocksData.find(x=>x.id===blockId);
  const{error}=await supa.from('harvest_schedule').insert({
    block_id:blockId,
    scheduled_date:date,
    estimated_kg:b?b.latestYieldEst:null,
    actual_kg:parseFloat(kg),
    actual_baume:baume!==''?parseFloat(baume):null,
    created_by:currentPersonName
  });
  if(error){alert('Σφάλμα: '+error.message);return;}
  await loadAll();render();
}

function scheduledCard(b){
  const s=scheduleByBlock[b.id];
  return `<div class="card">
    <div class="block-row">
      <div>
        <div class="block-name">${b.blockCode}${b.vineyardCode?' · '+b.vineyardCode:''}</div>
        <div class="block-meta">${b.variety}${s.estimated_kg?' · πρόβλεψη '+s.estimated_kg+' kg':''}</div>
        ${s.created_by?`<div class="block-meta">Προγραμματίστηκε από: ${s.created_by}</div>`:''}
      </div>
      <span class="badge scheduled">Προγραμματισμένο</span>
    </div>
    <div class="row-actions">
      <input type="number" id="actual-${b.id}" placeholder="Πραγματικά kg" min="0" step="0.1">
      <input type="number" class="baume-input" id="actual-baume-${b.id}" placeholder="Baumé °" min="0" step="0.1">
      <button class="small" onclick="completeBlock('${b.id}','${s.id}')">✅ Ολοκλήρωση</button>
      ${isAdmin?`<button class="small ghost" onclick="unscheduleBlock('${b.id}','${s.id}')">Ακύρωση</button>`:''}
    </div>
  </div>`;
}

// Ακόμα κι όταν ο τρύγος έχει ολοκληρωθεί, το Baumé (ή τα κιλά) μπορεί να χρειαστεί να μπει/διορθωθεί
// τις επόμενες μέρες (π.χ. όταν έρθει το αποτέλεσμα από το εργαστήριο) — γι' αυτό υπάρχει πάντα Edit.
// Η ίδια η ημερομηνία τρύγου μπορεί να έχει περαστεί λάθος· τη διόρθωση αυτή την επιτρέπουμε
// μόνο στον admin (πραγματικό login), όχι σε πρόσβαση με κωδικό, γιατί αλλάζει ιστορικό δεδομένο.
function doneCard(b){
  const s=scheduleByBlock[b.id];
  return `<div class="card">
    <div class="block-row">
      <div>
        <div class="block-name">${b.blockCode}${b.vineyardCode?' · '+b.vineyardCode:''}</div>
        <div class="block-meta">${b.variety} · τρυγήθηκε ${fmtDate(s.scheduled_date)} · ${s.actual_kg} kg${s.actual_baume!==null&&s.actual_baume!==undefined?' · Baumé '+s.actual_baume+'°':''}</div>
        ${(s.updated_by||s.created_by)?`<div class="block-meta">Τελευταία ενημέρωση από: ${s.updated_by||s.created_by}</div>`:''}
      </div>
      <span class="badge done">Ολοκληρώθηκε</span>
    </div>
    <div class="row-actions">
      <button class="small ghost" onclick="toggleDoneEdit('${b.id}')" id="de-toggle-${b.id}">✏️ Επεξεργασία</button>
    </div>
    <div class="row-actions" id="de-form-${b.id}" style="display:none;">
      ${isAdmin?`<input type="date" id="de-date-${b.id}" value="${s.scheduled_date||''}" title="Ημερομηνία τρύγου">`:''}
      <input type="number" id="de-kg-${b.id}" placeholder="Πραγματικά kg" min="0" step="0.1" value="${s.actual_kg!==null&&s.actual_kg!==undefined?s.actual_kg:''}">
      <input type="number" class="baume-input" id="de-baume-${b.id}" placeholder="Baumé °" min="0" step="0.1" value="${s.actual_baume!==null&&s.actual_baume!==undefined?s.actual_baume:''}">
      <button class="small" onclick="saveDoneEdit('${b.id}','${s.id}')">Αποθήκευση</button>
    </div>
  </div>`;
}

function toggleDoneEdit(blockId){
  const form=document.getElementById('de-form-'+blockId);
  form.style.display=(form.style.display==='none')?'flex':'none';
}

async function saveDoneEdit(blockId,scheduleId){
  const kg=document.getElementById('de-kg-'+blockId).value;
  const baume=document.getElementById('de-baume-'+blockId).value;
  const dateInp=document.getElementById('de-date-'+blockId); // υπάρχει μόνο αν isAdmin
  if(!kg){alert('Γράψε τα πραγματικά kg.');return;}
  const updates={
    actual_kg:parseFloat(kg),
    actual_baume:baume!==''?parseFloat(baume):null,
    updated_at:new Date().toISOString(),
    updated_by:currentPersonName
  };
  if(dateInp){
    if(!dateInp.value){alert('Διάλεξε ημερομηνία τρύγου.');return;}
    updates.scheduled_date=dateInp.value;
  }
  const{error}=await supa.from('harvest_schedule').update(updates).eq('id',scheduleId);
  if(error){alert('Σφάλμα: '+error.message);return;}
  await loadAll();render();
}

async function scheduleBlock(blockId){
  const date=document.getElementById('date-'+blockId).value;
  if(!date){alert('Διάλεξε ημερομηνία.');return;}
  const b=blocksData.find(x=>x.id===blockId);
  const{error}=await supa.from('harvest_schedule').insert({
    block_id:blockId,
    scheduled_date:date,
    estimated_kg:b?b.latestYieldEst:null,
    created_by:currentPersonName
  });
  if(error){alert('Σφάλμα: '+error.message);return;}
  await loadAll();render();
}

async function completeBlock(blockId,scheduleId){
  const val=document.getElementById('actual-'+blockId).value;
  const baumeVal=document.getElementById('actual-baume-'+blockId).value;
  if(!val){alert('Γράψε τα πραγματικά kg.');return;}
  const{error}=await supa.from('harvest_schedule').update({
    actual_kg:parseFloat(val),
    actual_baume:baumeVal!==''?parseFloat(baumeVal):null,
    updated_at:new Date().toISOString(),
    updated_by:currentPersonName
  }).eq('id',scheduleId);
  if(error){alert('Σφάλμα: '+error.message);return;}
  await loadAll();render();
}

async function unscheduleBlock(blockId,scheduleId){
  if(!confirm('Ακύρωση προγραμματισμού για αυτό το block;'))return;
  const{error}=await supa.from('harvest_schedule').delete().eq('id',scheduleId);
  if(error){alert('Σφάλμα: '+error.message);return;}
  await loadAll();render();
}

function renderThresholds(){
  const varieties=[...new Set(blocksData.map(b=>b.variety))].sort((a,b)=>a.localeCompare(b,'el'));
  const panel=document.getElementById('threshPanel');
  if(!varieties.length){panel.innerHTML='';return;}
  panel.innerHTML=varieties.map(v=>`
    <div class="thresh-row">
      <span>${v}</span>
      <span>
        <input type="number" id="th-${cssId(v)}" value="${thresholdFor(v)}" step="0.5" min="0">
        <button class="small" onclick="saveThreshold('${v.replace(/'/g,"\\'")}')">Αποθήκευση</button>
      </span>
    </div>`).join('');
}
function cssId(s){return s.replace(/[^a-zA-Z0-9]/g,'_');}

async function saveThreshold(variety){
  const val=parseFloat(document.getElementById('th-'+cssId(variety)).value);
  if(isNaN(val)){alert('Μη έγκυρη τιμή.');return;}
  const{error}=await supa.from('variety_thresholds').upsert({
    winery_id:WINERY_ID,variety,baume_threshold:val,updated_at:new Date().toISOString()
  },{onConflict:'winery_id,variety'});
  if(error){alert('Σφάλμα: '+error.message);return;}
  thresholdsByVariety[variety]=val;
  render();
}

document.getElementById('threshToggle').addEventListener('click',()=>{
  document.getElementById('threshPanel').classList.toggle('open');
});

requireAuthAndLoad();
</script>
</body>
</html>
