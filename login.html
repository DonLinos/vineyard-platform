<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Σύνδεση — Vineyard Field Reports</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  :root {
    --ink: #f2ede1;
    --ink-dim: #b9c2b3;
    --ink-faint: #7c8a78;
    --bg: #1d2620;
    --bg-card: #26312a;
    --line: #3a473e;
    --gold: #c99a3e;
    --gold-dim: #8f6f2c;
    --danger: #d97757;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
    padding: 40px 24px;
  }
  #contours {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.35;
  }
  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 6px;
    text-align: center;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 27px;
    text-align: center;
    margin: 0 0 34px;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 26px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--ink-dim);
    margin: 0 0 6px;
  }
  .field {
    margin-bottom: 16px;
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    background: #18201b;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 11px 12px;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: var(--gold-dim);
  }
  button.primary {
    width: 100%;
    background: var(--gold);
    color: #241a08;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.15s, opacity 0.15s;
  }
  button.primary:hover { background: #dcaa4c; }
  button.primary:disabled { opacity: 0.55; cursor: default; }
  .msg {
    font-size: 13px;
    line-height: 1.5;
    margin: 14px 0 0;
    padding: 10px 12px;
    border-radius: 6px;
    display: none;
  }
  .msg.error {
    display: block;
    background: rgba(217, 119, 87, 0.12);
    color: #eeab93;
    border: 1px solid rgba(217, 119, 87, 0.3);
  }
  .msg.info {
    display: block;
    background: rgba(201, 154, 62, 0.1);
    color: var(--gold);
    border: 1px solid rgba(201, 154, 62, 0.25);
  }
  .foot {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--ink-faint);
  }
  .foot a {
    color: var(--ink-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .foot a:hover { color: var(--gold); border-color: var(--gold-dim); }
  #app-view {
    display: none;
  }
  #app-view .card { text-align: center; }
  #app-view p { color: var(--ink-dim); font-size: 14px; margin: 4px 0; }
  #winery-select {
    width: 100%;
    background: #18201b;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 11px 12px;
    font-size: 15px;
    color: var(--ink);
    margin: 14px 0;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin: 0 0 20px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px;
  }
  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 6px;
    padding: 10px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-dim);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab-btn.active { background: var(--gold); color: #241a08; }
  input[type="text"].code-input {
    width: 100%;
    background: #18201b;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 11px 12px;
    font-size: 20px;
    letter-spacing: .08em;
    color: var(--ink);
    outline: none;
    text-align: center;
    text-transform: uppercase;
  }
  input[type="text"].code-input:focus { border-color: var(--gold-dim); }
</style>
</head>
<body>

<svg id="contours" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <path d="M -20 120 Q 100 80 200 130 T 420 110" stroke="#3a473e" stroke-width="1.5" fill="none"/>
  <path d="M -20 180 Q 110 140 210 190 T 420 170" stroke="#3a473e" stroke-width="1.5" fill="none"/>
  <path d="M -20 240 Q 120 200 220 250 T 420 230" stroke="#3a473e" stroke-width="1.5" fill="none"/>
  <path d="M -20 600 Q 100 640 220 610 T 420 630" stroke="#3a473e" stroke-width="1.5" fill="none"/>
  <path d="M -20 660 Q 110 700 230 670 T 420 690" stroke="#3a473e" stroke-width="1.5" fill="none"/>
  <path d="M -20 720 Q 120 760 240 730 T 420 750" stroke="#3a473e" stroke-width="1.5" fill="none"/>
</svg>

<div class="wrap">

  <div id="login-view">
    <p class="eyebrow">Αμπελουργική παρακολούθηση</p>
    <h1>Σύνδεση</h1>

    <div class="tabs">
      <button class="tab-btn active" id="tab-code" type="button">Κωδικός πρόσβασης</button>
      <button class="tab-btn" id="tab-email" type="button">Email (σύμβουλος)</button>
    </div>

    <div id="code-view">
      <div class="card">
        <div class="field">
          <label for="code">Ο προσωπικός σου κωδικός</label>
          <input type="text" class="code-input" id="code" autocomplete="off" placeholder="π.χ. VK4821" maxlength="20">
        </div>
        <button class="primary" id="code-btn">Είσοδος</button>
        <div class="msg" id="code-msg"></div>
      </div>
      <p class="foot">Δεν έχεις κωδικό; Απευθύνσου στον γεωπόνο σου.</p>
    </div>

    <div id="email-view" style="display:none;">
      <div class="card">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="name@example.com">
        </div>
        <div class="field">
          <label for="password">Κωδικός</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="field" id="signup-note-field" style="display:none;">
          <label for="signup-note">Ποιο οινοποίειο αφορά; (προαιρετικό)</label>
          <input type="text" id="signup-note" placeholder="π.χ. Βασιλικόν Winery">
        </div>
        <button class="primary" id="login-btn">Σύνδεση</button>
        <button class="primary" id="signup-btn" style="display:none;background:transparent;border:1px solid var(--gold-dim);color:var(--gold);">Δημιουργία λογαριασμού</button>
        <div class="msg" id="login-msg"></div>
      </div>
      <p class="foot" id="signup-toggle-foot">Δεν έχεις λογαριασμό; <a id="show-signup">Κάνε εγγραφή</a></p>
    </div>
  </div>

  <div id="app-view">
    <p class="eyebrow">Συνδεδεμένος ως</p>
    <h1 id="user-email-display" style="font-size:19px;"></h1>
    <div class="card">
      <div id="single-winery" style="display:none;">
        <p>Κτήμα</p>
        <h1 id="single-winery-name" style="font-size:22px; margin:6px 0 4px;"></h1>
      </div>
      <div id="multi-winery" style="display:none;">
        <p>Επίλεξε κτήμα</p>
        <select id="winery-select"></select>
      </div>
      <button class="primary" id="continue-btn" style="margin-top:18px;">Συνέχεια</button>
      <div class="msg" id="app-msg"></div>
    </div>
    <p class="foot"><a id="logout-link">Αποσύνδεση</a></p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const HAS_RETURN = urlParams.has('return');
  const RETURN_TO = urlParams.get('return') || 'reports.html';

  const loginView = document.getElementById("login-view");
  const appView = document.getElementById("app-view");
  const loginMsg = document.getElementById("login-msg");
  const appMsg = document.getElementById("app-msg");
  const loginBtn = document.getElementById("login-btn");

  function showMsg(el, text, type) {
    el.textContent = text;
    el.className = "msg " + type;
  }

  function clearMsg(el) {
    el.textContent = "";
    el.className = "msg";
  }

  // ─── Tabs: Κωδικός πρόσβασης (πελάτης/εργαζόμενος) vs. Email (σύμβουλος) ───
  const tabCode = document.getElementById("tab-code");
  const tabEmail = document.getElementById("tab-email");
  const codeView = document.getElementById("code-view");
  const emailView = document.getElementById("email-view");

  function showCodeTab() {
    tabCode.classList.add("active"); tabEmail.classList.remove("active");
    codeView.style.display = "block"; emailView.style.display = "none";
  }
  function showEmailTab() {
    tabEmail.classList.add("active"); tabCode.classList.remove("active");
    emailView.style.display = "block"; codeView.style.display = "none";
  }
  tabCode.addEventListener("click", showCodeTab);
  tabEmail.addEventListener("click", showEmailTab);

  // ─── Είσοδος με κωδικό πρόσβασης (χωρίς λογαριασμό Supabase) ───
  const codeMsg = document.getElementById("code-msg");
  const codeBtn = document.getElementById("code-btn");
  const codeInput = document.getElementById("code");

  async function submitCode() {
    const code = codeInput.value.trim();
    if (!code) { showMsg(codeMsg, "Γράψε τον κωδικό σου.", "error"); return; }

    codeBtn.disabled = true; codeBtn.textContent = "Έλεγχος...";
    clearMsg(codeMsg);

    // Χρησιμοποιεί τη συνάρτηση check_access_code (βλ. signup-and-access-security-setup.sql)
    // αντί για απευθείας select στον πίνακα access_codes — έτσι ο δημόσιος (anon) χρήστης δεν
    // μπορεί να διαβάσει ΟΛΟΥΣ τους κωδικούς, μόνο να ελέγξει τον συγκεκριμένο που έγραψε.
    const { data: rows, error } = await supa.rpc("check_access_code", { p_code: code });
    const data = rows && rows[0];

    codeBtn.disabled = false; codeBtn.textContent = "Είσοδος";

    if (error || !data || !data.active) {
      showMsg(codeMsg, "Ο κωδικός δεν αναγνωρίστηκε. Έλεγξε ότι τον έγραψες σωστά.", "error");
      return;
    }

    sessionStorage.setItem("accessSession", JSON.stringify({
      wineryId: data.winery_id,
      personName: data.person_name
    }));

    notifyFirstLoginIfNeeded(code, data.is_first_use);

    const sep = RETURN_TO.includes("?") ? "&" : "?";
    window.location.href = RETURN_TO + sep + "winery_id=" + encodeURIComponent(data.winery_id);
  }

  codeBtn.addEventListener("click", submitCode);
  codeInput.addEventListener("keydown", e => { if (e.key === "Enter") submitCode(); });

  // ─── Σύνδεση ↔ Εγγραφή (μέσα στο tab "Email") ───
  let signupMode = false;
  const signupBtn = document.getElementById("signup-btn");
  const showSignupLink = document.getElementById("show-signup");
  const signupNoteField = document.getElementById("signup-note-field");
  const signupToggleFoot = document.getElementById("signup-toggle-foot");

  function setSignupMode(on) {
    signupMode = on;
    clearMsg(loginMsg);
    loginBtn.style.display = on ? "none" : "block";
    signupBtn.style.display = on ? "block" : "none";
    signupNoteField.style.display = on ? "block" : "none";
    signupToggleFoot.innerHTML = on
      ? 'Έχεις ήδη λογαριασμό; <a id="show-signup">Σύνδεση</a>'
      : 'Δεν έχεις λογαριασμό; <a id="show-signup">Κάνε εγγραφή</a>';
    // Το innerHTML πιο πάνω έφτιαξε νέο <a>, οπότε ξαναδένουμε το click handler του.
    document.getElementById("show-signup").addEventListener("click", () => setSignupMode(!signupMode));
  }
  showSignupLink.addEventListener("click", () => setSignupMode(!signupMode));

  async function handleSignup() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const note = document.getElementById("signup-note").value.trim();
    clearMsg(loginMsg);

    if (!email || !password) {
      showMsg(loginMsg, "Συμπλήρωσε email και κωδικό.", "error");
      return;
    }
    if (password.length < 6) {
      showMsg(loginMsg, "Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.", "error");
      return;
    }

    signupBtn.disabled = true;
    signupBtn.textContent = "Δημιουργία...";

    const { data, error } = await supa.auth.signUp({ email, password });

    signupBtn.disabled = false;
    signupBtn.textContent = "Δημιουργία λογαριασμού";

    if (error) {
      showMsg(loginMsg, "Αποτυχία εγγραφής: " + error.message, "error");
      return;
    }

    // Καταγραφή της αίτησης, ώστε ο σύμβουλος να τη δει στο admin και να δώσει πρόσβαση.
    // Αν δεν υπάρχει ακόμα session (π.χ. χρειάζεται επιβεβαίωση email), το insert θα αποτύχει
    // αθόρυβα λόγω RLS — δεν πειράζει, ο λογαριασμός δημιουργήθηκε ούτως ή άλλως σωστά.
    if (data.user) {
      await supa.from("pending_signups").upsert(
        { user_id: data.user.id, email, note: note || null },
        { onConflict: "user_id", ignoreDuplicates: true }
      );
    }

    if (data.session) {
      showMsg(loginMsg, "Ο λογαριασμός δημιουργήθηκε! Περίμενε να σου δοθεί πρόσβαση σε οινοποίειο από τον σύμβουλο.", "info");
    } else {
      showMsg(loginMsg, "Ο λογαριασμός δημιουργήθηκε — έλεγξε το email σου για επιβεβαίωση, και μετά περίμενε να σου δοθεί πρόσβαση από τον σύμβουλο.", "info");
    }
  }

  signupBtn.addEventListener("click", handleSignup);

  async function handleLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    clearMsg(loginMsg);

    if (!email || !password) {
      showMsg(loginMsg, "Συμπλήρωσε email και κωδικό.", "error");
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Σύνδεση...";

    const { data, error } = await supa.auth.signInWithPassword({ email, password });

    loginBtn.disabled = false;
    loginBtn.textContent = "Σύνδεση";

    if (error) {
      showMsg(loginMsg, "Λάθος email ή κωδικός. Δοκίμασε ξανά.", "error");
      return;
    }

    await loadMemberships(data.user);
  }

  async function loadMemberships(user) {
    document.getElementById("user-email-display").textContent = user.email;

    const { data: memberships, error } = await supa
      .from("memberships")
      .select("winery_id, role, wineries(name)")
      .eq("user_id", user.id);

    if (error || !memberships || memberships.length === 0) {
      loginView.style.display = "none";
      appView.style.display = "block";
      showMsg(appMsg, "Δεν έχεις πρόσβαση σε κανένα κτήμα ακόμα. Απευθύνσου στον γεωπόνο σου.", "error");
      // Safety net: αν το insert στο pending_signups απέτυχε τη στιγμή του sign up (π.χ. γιατί
      // χρειαζόταν επιβεβαίωση email και τότε δεν υπήρχε ακόμα συνδεδεμένη σύνοδος), το
      // καταγράφουμε τώρα — έτσι ο χρήστης θα φανεί σίγουρα στο admin για να του δοθεί πρόσβαση.
      await supa.from("pending_signups").upsert(
        { user_id: user.id, email: user.email },
        { onConflict: "user_id", ignoreDuplicates: true }
      );
      return;
    }

    loginView.style.display = "none";
    appView.style.display = "block";

    if (memberships.length === 1) {
      document.getElementById("single-winery").style.display = "block";
      document.getElementById("single-winery-name").textContent = memberships[0].wineries.name;
      window._selectedWineryId = memberships[0].winery_id;
    } else {
      document.getElementById("multi-winery").style.display = "block";
      const select = document.getElementById("winery-select");
      select.innerHTML = "";
      memberships.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.winery_id;
        opt.textContent = m.wineries.name + (m.role === "agronomist" ? " (όλα)" : "");
        select.appendChild(opt);
      });
      window._selectedWineryId = select.value;
      select.addEventListener("change", () => { window._selectedWineryId = select.value; });
    }
  }

  document.getElementById("continue-btn").addEventListener("click", () => {
    if (!window._selectedWineryId) return;
    // Αν ήρθε εδώ επειδή έληξε η σύνδεσή του σε συγκεκριμένη σελίδα (π.χ. harvest.html), γύρνα
    // τον εκεί· αλλιώς (κανονική είσοδος μέσω QR/shortcut) πήγαινε στο admin, όπως πάντα.
    const dest = HAS_RETURN ? RETURN_TO : "admin.html";
    window.location.href = dest + "?winery_id=" + window._selectedWineryId;
  });

  document.getElementById("logout-link").addEventListener("click", async () => {
    await supa.auth.signOut();
    window.location.reload();
  });

  loginBtn.addEventListener("click", handleLogin);
  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") handleLogin();
  });

  (async () => {
    const { data: { session } } = await supa.auth.getSession();
    if (session && session.user) {
      await loadMemberships(session.user);
    }
  })();
</script>

</body>
</html>
