<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Είσοδος — Vineyard Reports</title>
<style>
  :root {
    --ink: #f2ede1; --ink-dim: #b9c2b3; --ink-faint: #7c8a78;
    --bg: #1d2620; --bg-card: #26312a; --line: #3a473e;
    --gold: #c99a3e; --gold-dim: #8f6f2c; --danger: #d97757;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { min-height:100vh; min-height:100dvh; padding:40px 24px; }
  .wrap { max-width:380px; margin:0 auto; }
  .eyebrow { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); text-align:center; margin:0 0 6px; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:27px; text-align:center; margin:0 0 34px; }
  .card { background:var(--bg-card); border:1px solid var(--line); border-radius:10px; padding:28px 26px; }
  label { display:block; font-size:13px; color:var(--ink-dim); margin:0 0 6px; }
  .field { margin-bottom:16px; }
  input[type="text"] {
    width:100%; background:#18201b; border:1px solid var(--line); border-radius:6px;
    padding:11px 12px; font-size:20px; letter-spacing:.08em; color:var(--ink); outline:none;
    text-align:center; text-transform:uppercase;
  }
  input[type="text"]:focus { border-color:var(--gold-dim); }
  button.primary {
    width:100%; background:var(--gold); color:#241a08; border:none; border-radius:6px;
    padding:12px; font-size:15px; font-weight:600; cursor:pointer; margin-top:6px;
  }
  button.primary:hover { background:#dcaa4c; }
  button.primary:disabled { opacity:.55; cursor:default; }
  .msg { font-size:13px; line-height:1.5; margin:14px 0 0; padding:10px 12px; border-radius:6px; display:none; }
  .msg.error { display:block; background:rgba(217,119,87,.12); color:#eeab93; border:1px solid rgba(217,119,87,.3); }
  .foot { text-align:center; margin-top:18px; font-size:13px; color:var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Αμπελουργική παρακολούθηση</p>
  <h1>Είσοδος με κωδικό</h1>
  <div class="card">
    <div class="field">
      <label for="code">Ο προσωπικός σου κωδικός</label>
      <input type="text" id="code" autocomplete="off" placeholder="π.χ. VK4821" maxlength="20">
    </div>
    <button class="primary" id="go-btn">Είσοδος</button>
    <div class="msg" id="msg"></div>
  </div>
  <p class="foot">Δεν έχεις κωδικό; Απευθύνσου στον γεωπόνο σου.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://xxyrareqzgvsaolhftbh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_x46jDuVbrSELrlekl5pQ7A_4i4xuaNE";
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const RETURN_TO = urlParams.get('return') || 'reports.html';

  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('go-btn');
  const input = document.getElementById('code');

  function showError(text) {
    msgEl.textContent = text;
    msgEl.className = 'msg error';
  }

  async function submitCode() {
    const code = input.value.trim();
    if (!code) { showError('Γράψε τον κωδικό σου.'); return; }

    btn.disabled = true; btn.textContent = 'Έλεγχος...';
    msgEl.className = 'msg';

    const { data, error } = await supa
      .from('access_codes')
      .select('winery_id, person_name, active')
      .eq('code', code)
      .maybeSingle();

    btn.disabled = false; btn.textContent = 'Είσοδος';

    if (error || !data || !data.active) {
      showError('Ο κωδικός δεν αναγνωρίστηκε. Έλεγξε ότι τον έγραψες σωστά.');
      return;
    }

    sessionStorage.setItem('accessSession', JSON.stringify({
      wineryId: data.winery_id,
      personName: data.person_name
    }));

    const sep = RETURN_TO.includes('?') ? '&' : '?';
    window.location.href = RETURN_TO + sep + 'winery_id=' + encodeURIComponent(data.winery_id);
  }

  btn.addEventListener('click', submitCode);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submitCode(); });
  input.focus();
</script>
</body>
</html>
