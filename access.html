<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Είσοδος — Vineyard Reports</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2620">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --ink: #f2ede1; --ink-dim: #b9c2b3; --ink-faint: #7c8a78;
    --bg: #1d2620; --bg-card: #26312a; --line: #3a473e;
    --gold: #c99a3e; --gold-dim: #8f6f2c; --danger: #d97757;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { min-height:100vh; min-height:100dvh; padding:40px 24px; }
  .wrap { max-width:380px; margin:0 auto; }
  .eyebrow { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); text-align:center; margin:0 0 6px; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:27px; text-align:center; margin:0 0 34px; }
  .card { background:var(--bg-card); border:1px solid var(--line); border-radius:10px; padding:28px 26px; }
  label { display:block; font-size:13px; color:var(--ink-dim); margin:0 0 6px; }
  .field { margin-bottom:16px; }
  input[type="text"] {
    width:100%; background:#18201b; border:1px solid var(--line); border-radius:6px;
    padding:11px 12px; font-size:20px; letter-spacing:.08em; color:var(--ink); outline:none;
    text-align:center; text-transform:uppercase;
  }
  input[type="text"]:focus { border-color:var(--gold-dim); }
  button.primary {
    width:100%; background:var(--gold); color:#241a08; border:none; border-radius:6px;
    padding:12px; font-size:15px; font-weight:600; cursor:pointer; margin-top:6px;
  }
  button.primary:hover { background:#dcaa4c; }
  button.primary:disabled { opacity:.55; cursor:default; }
  .msg { font-size:13px; line-height:1.5; margin:14px 0 0; padding:10px 12px; border-radius:6px; display:none; }
  .msg.error { display:block; background:rgba(217,119,87,.12); color:#eeab93; border:1px solid rgba(217,119,87,.3); }
  .foot { text-align:center; margin-top:18px; font-size:13px; color:var(--ink-faint); }

  /* Εποχιακό/ημερήσιο hero — μέχρι να ανέβουν πραγματικές φωτογραφίες (βλ. SEASON_PHOTOS στο
     script) δείχνει gradient + εικονίδιο ανάλογα με την εποχή του χρόνου στην Κύπρο. */
  .hero { position:relative; height:150px; border-radius:12px; overflow:hidden; margin:0 0 22px; background-size:cover; background-position:center; display:flex; align-items:flex-end; }
  .hero::after { content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 65%); }
  .hero-label { position:relative; z-index:1; padding:12px 16px; font-size:13px; color:#fff; display:flex; align-items:center; gap:8px; }
  .hero-label .ic { font-size:18px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Αμπελουργική παρακολούθηση</p>
  <h1>Είσοδος με κωδικό</h1>
  <div class="hero" id="hero"><div class="hero-label"><span class="ic" id="heroIcon">🍇</span><span id="heroLabel">…</span></div></div>
  <div class="card">
    <form id="code-form" autocomplete="off" onsubmit="return false;">
    <div class="field">
      <label for="code">Ο προσωπικός σου κωδικός</label>
      <input type="text" id="code" name="vitis-access-code" autocomplete="one-time-code" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="π.χ. VK4821" maxlength="20">
    </div>
    <button class="primary" type="button" id="go-btn">Είσοδος</button>
    <div class="msg" id="msg"></div>
    </form>
  </div>
  <p class="foot">Δεν έχεις κωδικό; Απευθύνσου στον γεωπόνο σου.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
    const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const RETURN_TO = urlParams.get('return') || 'reports.html';

  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('go-btn');
  const input = document.getElementById('code');

  function showError(text) {
    msgEl.textContent = text;
    msgEl.className = 'msg error';
  }

  async function submitCode() {
    const code = input.value.trim();
    if (!code) { showError('Γράψε τον κωδικό σου.'); return; }

    btn.disabled = true; btn.textContent = 'Έλεγχος...';
    msgEl.className = 'msg';

    // Χρησιμοποιεί τη συνάρτηση check_access_code (βλ. signup-and-access-security-setup.sql)
    // αντί για απευθείας select στον πίνακα access_codes.
    const { data: rows, error } = await supa.rpc('check_access_code', { p_code: code });
    const data = rows && rows[0];

    btn.disabled = false; btn.textContent = 'Είσοδος';

    if (error || !data || !data.active) {
      showError('Ο κωδικός δεν αναγνωρίστηκε. Έλεγξε ότι τον έγραψες σωστά.');
      return;
    }

    sessionStorage.setItem('accessSession', JSON.stringify({
      wineryId: data.winery_id,
      personName: data.person_name
    }));

    notifyFirstLoginIfNeeded(code, data.is_first_use);

    const sep = RETURN_TO.includes('?') ? '&' : '?';
    window.location.href = RETURN_TO + sep + 'winery_id=' + encodeURIComponent(data.winery_id);
  }

  btn.addEventListener('click', submitCode);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submitCode(); });
  input.focus();

  // ─── Εποχιακό/ημερήσιο hero ───
  // Πρόσθεσε εδώ πραγματικές φωτογραφίες (5-10 ανά εποχή) όταν είναι έτοιμες — π.χ.
  // 'photos/autumn-1.jpg' — και θα εμφανίζονται αυτόματα αντί για το gradient fallback,
  // αλλάζοντας κάθε μέρα (βάσει ημέρας του έτους).
  const SEASON_PHOTOS = {
    winter: [], // Δεκ–Φεβ: κλάδεμα, ανάπαυση πρέμνων
    spring: [], // Μαρ–Μάιος: βλάστηση, άνθιση
    summer: [], // Ιούν–Αύγ: ωρίμανση, καλοκαιρινές εργασίες
    autumn: []  // Σεπ–Νοέ: τρύγος
  };
  const SEASONS = {
    winter: { icon:'✂️', label:'Χειμώνας · Κλάδεμα', gradient:'linear-gradient(135deg,#2b3a4a,#1d2620)' },
    spring: { icon:'🌱', label:'Άνοιξη · Βλάστηση', gradient:'linear-gradient(135deg,#3d5a3a,#26312a)' },
    summer: { icon:'☀️', label:'Καλοκαίρι · Ωρίμανση', gradient:'linear-gradient(135deg,#8f6f2c,#3a2e18)' },
    autumn: { icon:'🍇', label:'Φθινόπωρο · Τρύγος', gradient:'linear-gradient(135deg,#7a3b2e,#3a231c)' }
  };
  function seasonForDate(d) {
    const m = d.getMonth() + 1; // 1-12
    if (m === 12 || m <= 2) return 'winter';
    if (m >= 3 && m <= 5) return 'spring';
    if (m >= 6 && m <= 8) return 'summer';
    return 'autumn';
  }
  function dayOfYear(d) {
    const start = new Date(d.getFullYear(), 0, 0);
    return Math.floor((d - start) / 86400000);
  }
  (function setHero() {
    const today = new Date();
    const key = seasonForDate(today);
    const meta = SEASONS[key];
    const heroEl = document.getElementById('hero');
    const photos = SEASON_PHOTOS[key];
    if (photos && photos.length) {
      const photo = photos[dayOfYear(today) % photos.length];
      heroEl.style.backgroundImage = `url('${photo}')`;
    } else {
      heroEl.style.background = meta.gradient;
    }
    document.getElementById('heroIcon').textContent = meta.icon;
    document.getElementById('heroLabel').textContent = meta.label;
  })();
</script>
</body>
</html>
